  const tabs=[['profile','My Profile']];
  if(isAdmin){tabs.push(['client','Clients'],['user','Add User']);}

  const tabHtml=tabs.map(([id,l])=>'<button type="button" class="settings-tab'+(settingsTab===id?' active':'')+'" onclick="setSettingsTab(\''+id+'\')">'+l+'</button>').join('');

  const teamOpts=(settingsMeta&&settingsMeta.teams||[]).map(t=>'<option value="'+esc(t)+'">'+esc(t)+'</option>').join('');

  document.getElementById('content').innerHTML=
    '<div class="page-section settings-wrap">'+
    '<div class="section-label">Settings</div>'+
    '<div class="settings-tabs">'+tabHtml+'</div>'+

    '<div class="settings-panel'+(settingsTab==='profile'?' active':'')+'" id="setProfile">'+
      '<div class="detail-card"><div class="card-header"><div><div class="table-title">My Profile</div><div class="table-sub">Update your display name or password</div></div></div>'+
      '<form class="settings-form" onsubmit="saveProfileSettings(event)" style="padding:0 4px 4px">'+
        '<label>Email<span class="hint">Login email (read-only)</span><input type="email" value="'+esc(ME.email)+'" disabled></label>'+
        '<label>Display name<input type="text" id="profName" value="'+esc(ME.name||'')+'" required></label>'+
        '<label>Current password<span class="hint">Required only when changing password</span><input type="password" id="profCurPw" autocomplete="current-password"></label>'+
        '<label>New password<input type="password" id="profNewPw" autocomplete="new-password" minlength="10"></label>'+
        '<label>Confirm new password<input type="password" id="profConfPw" autocomplete="new-password" minlength="10"></label>'+
        '<button type="submit" class="settings-save" id="profSaveBtn">Save profile</button>'+
        '<div class="settings-msg" id="profMsg"></div>'+
      '</form></div></div>'+

    (isAdmin?
    '<div class="settings-panel'+(settingsTab==='client'?' active':'')+'" id="setClient">'+
      '<div class="detail-card"><div class="card-header"><div><div class="table-title">Clients</div><div class="table-sub">Add, edit, or delete — saved to clients.json</div></div></div>'+
      '<div id="clientFormWrap"><form class="settings-form" onsubmit="saveClientSettings(event)" style="padding:0 4px 4px">'+
        '<label>Client name<input type="text" id="clientName" required placeholder="e.g. Adobe Inspections"></label>'+
        '<label>Aliases<span class="hint">Comma-separated shorthand names</span><input type="text" id="clientAliases" placeholder="AI, Adobe Insp"></label>'+
        '<label>Email domains<span class="hint">Comma-separated, for meet attendee matching</span><input type="text" id="clientDomains" placeholder="adobeinspections.com"></label>'+
        '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px">'+
          '<button type="submit" class="settings-save" id="clientSaveBtn">Add client</button>'+
          '<button type="button" class="settings-cancel-btn" id="clientCancelBtn" style="display:none" onclick="clearClientEditForm()">Cancel edit</button>'+
        '</div>'+
        '<div class="settings-msg" id="clientMsg"></div>'+
      '</form></div>'+
      '<div id="clientListHost"></div></div></div>'+

    '<div class="settings-panel'+(settingsTab==='user'?' active':'')+'" id="setUser">'+
      '<div class="detail-card"><div class="card-header"><div><div class="table-title">Add User</div><div class="table-sub">Saved to users.json — dashboard login</div></div></div>'+
      '<form class="settings-form" onsubmit="saveUserSettings(event)" style="padding:0 4px 4px">'+
        '<label>Work email<input type="email" id="userEmail" required placeholder="name@digilatics.com" onblur="predictUserIdentities()"></label>'+
        '<label>Full name<input type="text" id="userName" required placeholder="First Last" onblur="predictUserIdentities()"></label>'+
        '<label>Username<input type="text" id="userUsername" required placeholder="firstname" onblur="predictUserIdentities()"></label>'+
        '<label>Password<input type="password" id="userPassword" required minlength="10" placeholder="Initial password"></label>'+
        '<label>Role<select id="userRole"><option value="employee">Employee</option><option value="lead">Lead</option><option value="admin">Admin</option></select></label>'+
        '<label>Team (for leads)<span class="hint">Pick or type comma-separated — e.g. Ads, SEO</span><input type="text" id="userTeams" list="teamOptions" placeholder="Ads"></label>'+
        '<datalist id="teamOptions">'+teamOpts+'</datalist>'+
        '<label>Identities (auto)<span class="hint">AI + rules — matched in ClickUp &amp; Calendar logs</span>'+
          '<div class="identity-predict-row">'+
            '<button type="button" class="identity-predict-btn" onclick="predictUserIdentities()">&#10024; Predict identities</button>'+
            '<span class="hint" id="identitySource"></span>'+
          '</div>'+
          '<input type="hidden" id="userIdentities" value="">'+
          '<div class="identity-preview" id="identityPreview"></div>'+
        '</label>'+
        '<label>Extra identities<span class="hint">Optional manual additions (comma-separated)</span><input type="text" id="userIdentitiesExtra" placeholder="Nickname, alt ClickUp name" oninput="mergeExtraIdentities()"></label>'+
        '<button type="submit" class="settings-save" id="userSaveBtn">Add user</button>'+
        '<div class="settings-msg" id="userMsg"></div>'+
      '</form>'+
      '<div class="settings-list" id="userListHost"></div></div></div>'
    :'')+
    '</div>';

  if(isAdmin&&settingsTab==='client')loadSettingsClientsList();
  if(isAdmin&&settingsTab==='user'){loadSettingsUsersList();setTimeout(function(){predictUserIdentities();},0);}
  syncNavForRole();
}

function navTo(id){
  closeNav();
  currentNav=id;
  document.querySelectorAll('.sidebar-nav .nav-item').forEach(el=>el.classList.toggle('active',el.dataset.nav===id));
  const title=document.getElementById('pageTitle');
  const sub=document.getElementById('pageSub');
  if(title)title.textContent=NAV_TITLES[id]||id;
  if(sub)sub.textContent=NAV_SUBS[id]||'';
  syncTopbarDigi();
  if(id==='settings'){renderSettingsView();window.scrollTo({top:0,behavior:'smooth'});return;}
  if(id==='mytime'){
    if(activePeriod==='day')activePeriod='week';
    renderMyTimeView();window.scrollTo({top:0,behavior:'smooth'});return;
  }
  if(ME.role==='employee'){currentNav='mytime';renderMyTimeView();return;}
  if(id==='sync'){renderDashboard();loadSyncStatus();const syncEl=document.getElementById('sec-sync');if(syncEl)syncEl.scrollIntoView({behavior:'smooth',block:'start'});return;}
  renderDashboard();
  const el=document.getElementById('sec-'+id);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
}
function toggleNav(){document.getElementById('appShell')?.classList.toggle('nav-open');}
function closeNav(){document.getElementById('appShell')?.classList.remove('nav-open');}

let chatHistory=[];
let chatOpen=false;
let predictedIdentities=[];

function renderIdentityChips(list){
  const host=document.getElementById('identityPreview');
  const hidden=document.getElementById('userIdentities');
  if(!host||!hidden)return;
  predictedIdentities=list||[];
  const extra=(document.getElementById('userIdentitiesExtra')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const all=[...predictedIdentities];
  extra.forEach(x=>{if(!all.some(i=>i.toLowerCase()===x.toLowerCase()))all.push(x);});
  hidden.value=all.join(', ');
  host.innerHTML=all.map(i=>'<span class="identity-chip">'+esc(i)+'</span>').join('');
}

function mergeExtraIdentities(){
  renderIdentityChips(predictedIdentities);
}

async function predictUserIdentities(){
  const nameEl=document.getElementById('userName');
  const emailEl=document.getElementById('userEmail');
  const userEl=document.getElementById('userUsername');
  const srcEl=document.getElementById('identitySource');
  if(!nameEl||!emailEl)return;
  const name=nameEl.value.trim();
  const email=emailEl.value.trim();
  const username=(userEl&&userEl.value.trim())||'';
  if(name.length<2||email.length<3)return;
  if(srcEl)srcEl.textContent='Predicting…';
  try{
    const res=await apiFetch('/api/admin/predict-identities',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,username})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok){if(srcEl)srcEl.textContent='Could not predict';return;}
    renderIdentityChips(data.identities||[]);
    if(srcEl){
      const tag=data.source==='mixed'?'AI + rules':(data.llmAvailable?'Rules (AI ready)':'Rules only');
      srcEl.textContent=tag;
    }
  }catch(e){if(srcEl)srcEl.textContent='Offline';}
}

async function initChatAssistant(){
  const fab=document.getElementById('chatFab');
  if(!fab)return;
  fab.style.display='flex';
  appendChatMsg('bot','Hi! Ask me about your hours today, this week, top clients, or recent activity.');
}

function toggleChatPanel(open){
  const panel=document.getElementById('chatPanel');
  if(!panel)return;
  if(open===false)chatOpen=false;
  else if(open===true)chatOpen=true;
  else chatOpen=!chatOpen;
  panel.classList.toggle('open',chatOpen);
}

function appendChatMsg(role,text){
  const host=document.getElementById('chatMsgs');
  if(!host)return;
  const el=document.createElement('div');
  el.className='chat-msg '+(role==='user'?'user':'bot');
  el.textContent=text;
  host.appendChild(el);
  host.scrollTop=host.scrollHeight;
}

function chatInputKey(ev){
  if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();sendChat();}
}

async function sendChat(){
  const input=document.getElementById('chatInput');
  const btn=document.getElementById('chatSendBtn');
  if(!input||!btn)return;
  const msg=input.value.trim();
  if(!msg)return;
  input.value='';
  btn.disabled=true;
  appendChatMsg('user',msg);
  chatHistory.push({role:'user',content:msg});
  appendChatMsg('bot','…');
  const pending=document.getElementById('chatMsgs')?.lastElementChild;
  try{
    const res=await apiFetch('/api/chat',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,history:chatHistory.slice(0,-1)})});
    const data=await res.json().catch(()=>({}));
    const reply=data.reply||data.detail||'No reply';
    if(pending)pending.textContent=reply;
    chatHistory.push({role:'assistant',content:reply});
    if(chatHistory.length>12)chatHistory=chatHistory.slice(-12);
  }catch(e){
    if(pending)pending.textContent='Network error — try again.';
  }finally{btn.disabled=false;}
}

boot();
</script>
