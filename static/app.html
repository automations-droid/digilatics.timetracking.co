<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Digilatics — Time Intelligent Dashboard</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<!-- SheetJS for Excel export -->
<!-- xlsx-js-style: drop-in fork of SheetJS that respects cell styles on write -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{--bg:#080c14;--bg2:#0e1420;--bg3:#131b2a;--bg4:#1a2436;--border:rgba(255,255,255,0.06);--text:#f0f4ff;--text2:#8899bb;--text3:#4a5a78;--accent:#ff6b2b;--accent2:#ffaa4d;--card-shadow:0 1px 3px rgba(0,0,0,0.5),0 8px 32px rgba(0,0,0,0.4);--radius:14px;--meet:#4a9eff;}
[data-theme="light"]{--bg:#f0f4fa;--bg2:#ffffff;--bg3:#f7f9fd;--bg4:#e8eef8;--border:rgba(0,0,0,0.07);--text:#0a1628;--text2:#4a5a78;--text3:#8899bb;--card-shadow:0 1px 3px rgba(0,0,0,0.05),0 8px 24px rgba(0,0,0,0.08);}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
.app{max-width:none;width:100%;margin:0;padding:0;}
/* ── App shell ── */
.shell{display:flex;min-height:100vh;width:100%;}
.sidebar{width:248px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:100;}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:0 18px;min-height:72px;height:72px;border-bottom:1px solid var(--border);box-sizing:border-box;}
.sidebar-brand .brand-mark{width:38px;height:38px;background:#2a2621;border-radius:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(255,107,43,0.35);flex-shrink:0;overflow:hidden;}
.sidebar-brand .brand-mark img,.sidebar-brand .brand-mark svg{width:22px;height:22px;display:block;object-fit:contain;}
.login-mark{width:56px;height:56px;background:#1a1a1a;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 0 20px;box-shadow:0 8px 20px rgba(255,107,43,.22);overflow:hidden;}
.login-mark img,.login-mark svg{width:32px;height:32px;display:block;}
.digi-toggle-wrap{display:flex;align-items:center;flex-shrink:0;}
.digi-toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);transition:all .15s;}
.digi-toggle:hover{border-color:rgba(255,107,43,.45);}
.digi-toggle input{position:absolute;opacity:0;width:0;height:0;}
.digi-toggle-ui{position:relative;width:38px;height:22px;border-radius:999px;background:var(--bg4);border:1px solid var(--border);transition:all .2s;flex-shrink:0;}
.digi-toggle-ui::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text3);transition:all .2s;}
.digi-toggle input:checked+.digi-toggle-ui{background:rgba(255,107,43,.25);border-color:rgba(255,107,43,.5);}
.digi-toggle input:checked+.digi-toggle-ui::after{transform:translateX(16px);background:var(--accent);}
.digi-toggle-label{font-size:12px;font-weight:700;color:var(--text2);white-space:nowrap;}
.digi-toggle input:checked~.digi-toggle-label{color:var(--accent);}
.dashboard-toolbar{display:flex;flex-direction:column;gap:12px;margin-bottom:24px;}
.dashboard-toolbar-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.sidebar-brand .brand-name{font-weight:800;font-size:17px;letter-spacing:-0.02em;color:#f57d20;line-height:1.1;}
.sidebar-brand .brand-sub{font-size:10px;color:var(--text3);margin-top:2px;letter-spacing:.02em;line-height:1.3;}
.sidebar-nav{flex:1;overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:2px;}
.nav-section{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:12px 12px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;border-radius:10px;background:transparent;color:var(--text2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left;transition:all .15s;}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{background:rgba(255,107,43,0.12);color:var(--accent);}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
.sidebar-foot{padding:14px;border-top:1px solid var(--border);font-size:11px;color:var(--text3);line-height:1.4;}
.sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;}
.sidebar-access{padding:10px 10px 0;display:none;}
.sidebar-access-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,107,43,.35);background:rgba(255,107,43,.1);color:var(--accent);font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:default;}
.sidebar-access-btn.lead{border-color:rgba(74,158,255,.35);background:rgba(74,158,255,.08);color:#4a9eff;}
.sidebar-user{padding:12px 10px 10px;border-top:1px solid var(--border);display:none;flex-direction:column;gap:8px;}
.sidebar-user .user-chip{width:100%;box-sizing:border-box;justify-content:space-between;padding:8px 10px;}
.sidebar-logout{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:inherit;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;transition:all .15s;}
.sidebar-logout:hover{border-color:#f87171;color:#f87171;background:rgba(248,113,113,.06);}
.sidebar-logout svg{width:16px;height:16px;flex-shrink:0;}
.shell-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:90;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;min-height:72px;height:72px;box-sizing:border-box;flex-wrap:nowrap;}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0;}
.topbar-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:nowrap;}
.topbar-actions .digi-toggle{padding:6px 10px;}
.topbar-actions .digi-toggle-label{font-size:11px;}
.topbar-actions .theme-btn,.topbar-actions .export-btn,.topbar-actions .refresh-btn{flex-shrink:0;}
.mytime-hero{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:24px 28px;margin-bottom:24px;box-shadow:var(--card-shadow);}
.mytime-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.mytime-hero-top h1{font-size:24px;font-weight:800;letter-spacing:-0.03em;margin:0 0 4px;}
.mytime-hero-top p{font-size:13px;color:var(--text2);margin:0;}
.mytime-periods{display:flex;flex-wrap:wrap;gap:6px;}
.mytime-period{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.mytime-period:hover{border-color:rgba(255,107,43,.4);color:var(--text);}
.mytime-period.active{background:rgba(255,107,43,.14);border-color:rgba(255,107,43,.45);color:var(--accent);}
.mytime-live-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:900px){.mytime-live-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.mytime-live-grid{grid-template-columns:1fr 1fr;}}
.mytime-live-card{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;}
.mytime-live-card.highlight{border-color:rgba(255,107,43,.35);background:linear-gradient(135deg,rgba(255,107,43,.08),rgba(74,158,255,.04));}
.mytime-live-card .lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);}
.mytime-live-card .val{font-size:22px;font-weight:800;color:var(--text);line-height:1.1;}
.mytime-live-card.tasks .val{color:var(--accent);}
.mytime-live-card.meets .val{color:#4a9eff;}
.mytime-live-card .sub{font-size:11px;color:var(--text3);}
.mytime-sync-note{font-size:11px;color:var(--text3);margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.mytime-rerun{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1px solid rgba(255,107,43,.35);background:rgba(255,107,43,.08);color:var(--accent);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;}
.mytime-rerun:hover{background:rgba(255,107,43,.16);border-color:rgba(255,107,43,.55);}
.mytime-rerun:disabled{opacity:.55;cursor:wait;}
.mytime-filter-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:16px 20px;margin-bottom:20px;box-shadow:var(--card-shadow);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.mytime-filter-card .mytime-periods{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0;}
.mytime-filter-card .date-picker-wrap{min-width:200px;}
.topbar-filters{display:none;}
.topbar-filters.show-filters{display:block;}
.dashboard-filters{margin-bottom:24px;}
.topbar-title{font-size:16px;font-weight:800;letter-spacing:-0.02em;color:var(--text);}
.topbar-sub{font-size:12px;color:var(--text3);}
.menu-toggle{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;align-items:center;justify-content:center;}
.menu-toggle svg{width:18px;height:18px;}
.header-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.app-main{flex:1;padding:24px 32px 48px;width:100%;max-width:none;}
@media(min-width:1600px){.app-main{padding-left:40px;padding-right:40px;}}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(8,12,20,0.45);z-index:99;}
.page-section{scroll-margin-top:88px;}
.header{display:none;} /* legacy header replaced by shell */
.tz-badge{font-size:11px;color:var(--text3);background:var(--bg4);border-radius:6px;padding:3px 8px;margin-left:8px;}
.theme-btn{width:38px;height:38px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;color:var(--text2);}
.theme-btn:hover{border-color:var(--accent);color:var(--text);}
.refresh-btn{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;padding:9px 18px;color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 4px 15px rgba(255,107,43,0.35);}
.refresh-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,107,43,0.5);}

/* ── Export Button ── */
.export-wrap{position:relative;}
.export-btn{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;color:var(--text2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.export-btn:hover{border-color:rgba(255,107,43,0.5);color:var(--text);background:var(--bg3);}
.export-btn svg{width:15px;height:15px;flex-shrink:0;}
.export-chevron{font-size:9px;opacity:.6;transition:transform .2s;}
.export-wrap.open .export-chevron{transform:rotate(180deg);}
.export-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--bg2);border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,0.18);z-index:9999;overflow:hidden;min-width:210px;}
.export-wrap.open .export-dropdown{display:block;}
.export-opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;font-family:inherit;font-size:13px;font-weight:500;color:var(--text2);background:transparent;border:none;cursor:pointer;transition:all .15s;text-align:left;}
.export-opt:hover{background:rgba(255,107,43,0.06);color:var(--text);}
.export-opt-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.export-opt-icon.pdf{background:rgba(239,68,68,0.12);color:#ef4444;}
.export-opt-icon.xls{background:rgba(34,197,94,0.12);color:#22c55e;}
.export-opt-label{display:flex;flex-direction:column;gap:1px;}
.export-opt-title{font-weight:700;font-size:12px;color:var(--text);}
.export-opt-sub{font-size:10px;color:var(--text3);}
.export-divider{height:1px;background:var(--border);margin:0;}

.loading{text-align:center;padding:80px 20px;color:var(--text3);}
.spinner{width:32px;height:32px;border:2px solid var(--bg4);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;}
/* Re-sync full-page EVA loader (Uiverse.io by Subaashbala — themed orange) */
.resync-overlay{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:rgba(8,12,20,.88);backdrop-filter:blur(8px);}
[data-theme="light"] .resync-overlay{background:rgba(240,244,250,.92);}
.resync-overlay.active{display:flex;}
.resync-overlay-text{font-size:14px;font-weight:700;color:var(--accent2);letter-spacing:.04em;margin:0;}
.resync-robot .modelViewPort{perspective:1000px;width:20rem;aspect-ratio:1;border-radius:50%;display:flex;justify-content:center;align-items:center;background:#000;overflow:hidden;box-shadow:0 0 60px rgba(255,107,43,.35);}
.resync-robot .eva{--EVA-ROTATION-DURATION:4s;transform-style:preserve-3d;animation:evaRotateRight var(--EVA-ROTATION-DURATION) linear infinite alternate;}
.resync-robot .head{position:relative;width:6rem;height:4rem;border-radius:48% 53% 45% 55%/79% 79% 20% 22%;background:linear-gradient(to right,white 45%,gray);}
.resync-robot .eyeChamber{width:4.5rem;height:2.75rem;position:relative;left:50%;top:55%;border-radius:45% 53% 45% 48%/62% 59% 35% 34%;background-color:#2a2621;box-shadow:0 0 2px 2px #ffb380,inset 0 0 0 2px #000;transform:translate(-50%,-50%);animation:evaMoveRight var(--EVA-ROTATION-DURATION) linear infinite alternate;}
.resync-robot .eye{width:1.2rem;height:1.5rem;position:absolute;border-radius:50%;}
.resync-robot .eye:first-child{left:12px;top:50%;background:repeating-linear-gradient(65deg,#ffb380 0,#ffb380 1px,white 2px);box-shadow:inset 0 0 5px #ff6b2b,0 0 15px 1px #ff8a4d;transform:translate(0,-50%) rotate(-65deg);}
.resync-robot .eye:nth-child(2){right:12px;top:50%;background:repeating-linear-gradient(-65deg,#ffb380 0,#ffb380 1px,white 2px);box-shadow:inset 0 0 5px #ff6b2b,0 0 15px 1px #ff8a4d;transform:translate(0,-50%) rotate(65deg);}
.resync-robot .body{width:6rem;height:8rem;position:relative;margin-block-start:.25rem;border-radius:47% 53% 45% 55%/12% 9% 90% 88%;background:linear-gradient(to right,white 35%,gray);}
.resync-robot .hand{position:absolute;left:-1.5rem;top:.75rem;width:2rem;height:5.5rem;border-radius:40%;background:linear-gradient(to left,white 15%,gray);box-shadow:5px 0 5px rgba(0,0,0,.25);transform:rotateY(55deg) rotateZ(10deg);}
.resync-robot .hand:first-child{animation:evaCompensateLeft var(--EVA-ROTATION-DURATION) linear infinite alternate;}
.resync-robot .hand:nth-child(2){left:92%;background:linear-gradient(to right,white 15%,gray);transform:rotateY(55deg) rotateZ(-10deg);animation:evaCompensateRight var(--EVA-ROTATION-DURATION) linear infinite alternate;}
.resync-robot .scannerThing{width:0;height:0;position:absolute;left:60%;top:10%;border-top:180px solid #ffaa4d;border-left:250px solid transparent;border-right:250px solid transparent;transform-origin:top left;mask:linear-gradient(to right,white,transparent 35%);animation:evaGlow 2s cubic-bezier(.86,0,.07,1) infinite;}
.resync-robot .scannerOrigin{position:absolute;width:8px;aspect-ratio:1;border-radius:50%;left:60%;top:10%;background:#ff6b2b;box-shadow:inset 0 0 5px rgba(0,0,0,.5),0 0 12px rgba(255,107,43,.8);animation:evaMoveRight var(--EVA-ROTATION-DURATION) linear infinite;}
@keyframes evaRotateRight{from{transform:rotateY(0deg);}to{transform:rotateY(25deg);}}
@keyframes evaMoveRight{from{transform:translate(-50%,-50%);}to{transform:translate(-40%,-50%);}}
@keyframes evaCompensateLeft{from{transform:rotateY(55deg) rotateZ(10deg);}to{transform:rotateY(30deg) rotateZ(10deg);}}
@keyframes evaCompensateRight{from{transform:rotateY(55deg) rotateZ(-10deg);}to{transform:rotateY(70deg) rotateZ(-10deg);}}
@keyframes evaGlow{from{opacity:0;}20%{opacity:1;}45%{transform:rotate(-25deg);}75%{transform:rotate(5deg);}100%{opacity:0;}}
@keyframes spin{to{transform:rotate(360deg)}}
.controls-bar{display:flex;align-items:stretch;gap:12px;margin-bottom:28px;justify-content:space-between;width:100%;}
.date-picker-wrap{position:relative;background:var(--bg2);border:1px solid rgba(255,107,43,0.25);border-radius:14px;box-shadow:var(--card-shadow);transition:border-color .2s,box-shadow .2s;flex-shrink:0;}
.date-picker-wrap:hover{border-color:rgba(255,107,43,0.6);box-shadow:var(--card-shadow),0 0 0 3px rgba(21, 20, 20, 0.07);}
.date-picker-btn{display:flex;align-items:center;gap:12px;width:100%;height:100%;padding:12px 14px;cursor:pointer;font-family:inherit;background:transparent;border:none;border-radius:14px;transition:background .15s;}
.date-picker-btn:hover,.date-picker-btn.open{background:rgba(255,107,43,0.04);}
.dpb-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,rgba(255,107,43,0.14),rgba(255,170,77,0.08));display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;border:1px solid rgba(255,107,43,0.15);}
.dpb-text{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;min-width:0;}
.dpb-label{display:none;}
.dpb-value{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dpb-arrow{width:20px;height:20px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--text3);transition:all .2s;flex-shrink:0;}
.date-picker-btn.open .dpb-arrow{transform:rotate(180deg);background:rgba(255,107,43,0.12);border-color:rgba(255,107,43,0.3);color:var(--accent);}
/* ── Date Picker Panel — matches screenshot style ── */
.dp-panel{display:none;position:absolute;top:calc(100% + 10px);right:0;background:#fff;border:1px solid #e5e9f0;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,0.13);z-index:9999;overflow:hidden;width:580px;}
[data-theme="dark"] .dp-panel{background:#0e1420;border-color:rgba(255,255,255,0.08);box-shadow:0 8px 40px rgba(0,0,0,0.5);}
.dp-panel.open{display:flex;}
.dp-presets{width:170px;flex-shrink:0;padding:14px 0;border-right:1px solid #e8edf5;background:#f7f9fd;}
[data-theme="dark"] .dp-presets{background:#131b2a;border-right-color:rgba(255,255,255,0.06);}
.dp-preset{display:block;width:100%;text-align:left;padding:10px 22px;font-family:inherit;font-size:13px;font-weight:500;color:#4a5a78;background:transparent;border:none;cursor:pointer;transition:all .12s;position:relative;}
[data-theme="dark"] .dp-preset{color:#8899bb;}
.dp-preset:hover{background:#eef1f8;color:#0a1628;}
[data-theme="dark"] .dp-preset:hover{background:#1a2436;color:#f0f4ff;}
.dp-preset.active{color:var(--accent);font-weight:700;background:transparent;}
.dp-preset.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:0 3px 3px 0;}
.dp-cal-wrap{flex:1;padding:18px 20px 16px;background:#fff;}
[data-theme="dark"] .dp-cal-wrap{background:#0e1420;}
.dp-date-inputs{display:flex;align-items:flex-end;gap:10px;margin-bottom:16px;}
.dp-date-field{flex:1;}
.dp-date-field label{display:block;font-size:9px;font-weight:700;color:#8899bb;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px;}
.dp-date-field input{width:100%;background:#f7f9fd;border:1px solid #e0e6f0;border-radius:9px;color:#0a1628;font-family:inherit;font-size:12px;font-weight:600;padding:9px 12px;outline:none;cursor:pointer;transition:border-color .15s;}
[data-theme="dark"] .dp-date-field input{background:#131b2a;border-color:rgba(255,255,255,0.08);color:#f0f4ff;}
.dp-date-field input:focus{border-color:var(--accent);}
.dp-date-field input::-webkit-calendar-picker-indicator{opacity:.5;cursor:pointer;}
[data-theme="dark"] .dp-date-field input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.4;}
.dp-dash{color:#c0cce0;font-size:20px;padding-bottom:9px;flex-shrink:0;}
.dp-month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.dp-month-label{font-size:14px;font-weight:700;color:#0a1628;}
[data-theme="dark"] .dp-month-label{color:#f0f4ff;}
.dp-nav-btn{width:30px;height:30px;background:#f7f9fd;border:1px solid #e0e6f0;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:#8899bb;transition:all .12s;line-height:1;}
[data-theme="dark"] .dp-nav-btn{background:#131b2a;border-color:rgba(255,255,255,0.08);color:#8899bb;}
.dp-nav-btn:hover{border-color:var(--accent);color:var(--accent);background:#fff8f5;}
[data-theme="dark"] .dp-nav-btn:hover{background:#1a2436;}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0;}
.dp-dow{text-align:center;font-size:11px;font-weight:600;color:#b0bdd4;padding:2px 0 10px;letter-spacing:.03em;}
.dp-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:400;color:#4a5a78;border-radius:8px;cursor:pointer;transition:all .1s;position:relative;margin:1px;}
[data-theme="dark"] .dp-day{color:#8899bb;}
.dp-day:hover:not(.dp-day-empty){background:#f0f4fa;color:#0a1628;}
[data-theme="dark"] .dp-day:hover:not(.dp-day-empty){background:#1a2436;color:#f0f4ff;}
.dp-day-empty{cursor:default;pointer-events:none;}
.dp-day-today{color:var(--accent);font-weight:700;}
.dp-day-today::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent);}
.dp-day-sel-from,.dp-day-sel-to{background:var(--accent)!important;color:#fff!important;font-weight:700;border-radius:8px;}
.dp-day-in-range{background:rgba(255,107,43,0.10);color:#cc4400;border-radius:0;}
[data-theme="dark"] .dp-day-in-range{background:rgba(255,107,43,0.13);color:#ffaa4d;}
.dp-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid #eef1f8;}
[data-theme="dark"] .dp-footer{border-top-color:rgba(255,255,255,0.06);}
.dp-cancel-btn{background:transparent;border:1px solid #dde3ee;border-radius:9px;color:#8899bb;font-family:inherit;font-size:12px;font-weight:600;padding:8px 18px;cursor:pointer;transition:all .12s;}
.dp-cancel-btn:hover{border-color:#8899bb;color:#4a5a78;}
.dp-apply-btn{background:var(--accent);border:none;border-radius:9px;color:#fff;font-family:inherit;font-size:12px;font-weight:700;padding:8px 20px;cursor:pointer;box-shadow:0 2px 8px rgba(255,107,43,0.35);transition:all .15s;}
.dp-apply-btn:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 14px rgba(255,107,43,0.45);}
/* ── Auth: half / half — login left, interactive stage right ── */
.login-screen{
  position:relative;isolation:isolate;min-height:100vh;overflow:hidden;color:#1a1a1a;
  display:grid;grid-template-columns:1fr 1fr;align-items:stretch;background:#f7f7f7;
}
.login-panel{
  position:relative;z-index:2;min-height:100vh;background:#fff;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:48px clamp(28px,5vw,64px);box-sizing:border-box;
  border-right:1px solid #ebebeb;
}
.login-panel-inner{width:100%;max-width:420px;text-align:left;animation:loginPanelIn .55s cubic-bezier(.22,1,.36,1) both;}
@keyframes loginPanelIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.login-title{font-size:30px;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px;color:#141414;}
.login-sub{font-size:14px;color:#6b6b6b;margin-bottom:28px;line-height:1.55;}
.login-form{display:flex;flex-direction:column;gap:14px;text-align:left;}
.login-form label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#8a8a8a;}
.login-form input{width:100%;box-sizing:border-box;background:#fafafa;border:1px solid #e4e4e4;border-radius:12px;padding:14px 16px;font-family:inherit;font-size:15px;color:#1a1a1a;outline:none;transition:border-color .15s,box-shadow .15s,background .15s;}
.login-form input::placeholder{color:#b0b0b0;}
.login-pass-wrap{position:relative;}
.login-pass-wrap input{padding-right:48px;}
.login-pass-toggle{position:absolute;top:50%;right:12px;transform:translateY(-50%);border:none;background:transparent;color:#9a9a9a;cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;border-radius:8px;}
.login-pass-toggle:hover{color:#1a1a1a;background:rgba(0,0,0,.05);}
.login-pass-toggle svg{width:18px;height:18px;pointer-events:none;}
.login-form input:focus{border-color:#ff6b2b;background:#fff;box-shadow:0 0 0 3px rgba(255,107,43,.16);}
.login-submit{margin-top:8px;width:100%;border:none;border-radius:12px;padding:15px 18px;font-family:inherit;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff6b2b,#ff8f4a);cursor:pointer;box-shadow:0 10px 24px rgba(255,107,43,.28);transition:transform .15s,filter .15s;}
.login-submit:hover{filter:brightness(1.04);transform:translateY(-1px);}
.login-submit:disabled{opacity:.6;cursor:wait;transform:none;}
.login-err{margin-top:14px;font-size:12px;color:#d64545;min-height:16px;}
.login-foot{margin-top:28px;font-size:12px;color:#9a9a9a;line-height:1.45;}

.login-stage{
  position:relative;min-height:100vh;overflow:hidden;background:#f2f2f2;
  display:flex;align-items:center;justify-content:center;
  cursor:crosshair;user-select:none;
}
.login-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:none;}
.login-stage-hint{
  position:absolute;z-index:3;left:50%;bottom:28px;transform:translateX(-50%);
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:#9a9a9a;pointer-events:none;opacity:.85;
}
@media (max-width:900px){
  .login-screen{grid-template-columns:1fr;grid-template-rows:auto 1fr;}
  .login-panel{min-height:auto;border-right:none;border-bottom:1px solid #ebebeb;padding:36px 24px 28px;order:2;}
  .login-stage{min-height:42vh;order:1;}
  .login-stage-hint{bottom:14px;}
  .login-panel-inner{max-width:520px;}
}
@media (prefers-reduced-motion:reduce){
  .login-panel-inner{animation:none;}
}
body.hide-clients #tbody-team tr td:last-child,
body.hide-clients #tbody-space tr td:last-child,
body.hide-clients #tbody-employee tr td:last-child{display:none;}
.coming-soon-card .coming-soon-body{min-height:160px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);}
.coming-soon-inline{color:var(--text3);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
/* ── Header user chip ── */
.user-chip{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:5px 6px 5px 12px;}
.user-chip .uc-meta{display:flex;flex-direction:column;line-height:1.15;flex:1;min-width:0;}
.user-chip .uc-name{font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-chip .uc-role{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.user-chip .uc-actions{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.uc-settings-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:none;border-radius:8px;background:transparent;color:var(--text3);cursor:pointer;transition:all .15s;}
.uc-settings-btn:hover{background:var(--bg3);color:var(--accent);}
.uc-settings-btn svg{width:16px;height:16px;}
.settings-wrap{max-width:920px;}
.settings-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.settings-tab{padding:9px 16px;border-radius:999px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.settings-tab:hover{border-color:rgba(255,107,43,.35);color:var(--text);}
.settings-tab.active{background:rgba(255,107,43,.14);border-color:rgba(255,107,43,.45);color:var(--accent);}
.settings-panel{display:none;}
.settings-panel.active{display:block;}
.settings-form{display:grid;gap:14px;max-width:520px;}
.settings-form label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--text2);}
.settings-form input,.settings-form select,.settings-form textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-family:inherit;font-size:13px;}
.settings-form textarea{min-height:72px;resize:vertical;}
.settings-form .hint{font-size:11px;font-weight:500;color:var(--text3);}
.settings-save{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 15px rgba(255,107,43,0.35);}
.settings-save:disabled{opacity:.55;cursor:wait;}
.settings-msg{font-size:12px;margin-top:8px;min-height:18px;}
.settings-msg.ok{color:#34d399;}
.settings-msg.err{color:#f87171;}
.settings-list{margin-top:18px;max-height:min(520px,60vh);overflow:auto;border:1px solid var(--border);border-radius:12px;}
.settings-list.clients-full{max-height:min(640px,65vh);}
.settings-list td,.settings-list th{vertical-align:top;}
.settings-list .cell-aliases,.settings-list .cell-domains{max-width:280px;word-break:break-word;font-size:11px;color:var(--text2);line-height:1.4;}
.settings-list .cell-name{font-weight:600;color:var(--text);min-width:160px;}
.settings-crud{display:flex;gap:6px;flex-shrink:0;}
.settings-crud button{padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;}
.settings-crud button:hover{border-color:rgba(255,107,43,.4);color:var(--accent);}
.settings-crud button.del:hover{border-color:#f87171;color:#f87171;}
.client-list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0 8px;}
.client-list-head .hint{margin:0;}
.client-search{flex:1;min-width:180px;max-width:320px;padding:8px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-family:inherit;font-size:12px;}
.settings-form-editing{border:1px solid rgba(255,107,43,.35);border-radius:12px;padding:12px;margin-bottom:4px;background:rgba(255,107,43,.05);}
.settings-cancel-btn{padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-left:8px;}
.settings-list table{width:100%;border-collapse:collapse;font-size:12px;}
.settings-list th,.settings-list td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);}
.settings-list th{position:sticky;top:0;background:var(--bg3);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);}
.identity-preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.identity-chip{font-size:11px;padding:4px 10px;border-radius:999px;background:rgba(74,158,255,.12);color:#4a9eff;border:1px solid rgba(74,158,255,.25);}
.identity-predict-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.identity-predict-btn{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;}
.identity-predict-btn:hover{border-color:rgba(74,158,255,.4);color:#4a9eff;}
.chat-fab{position:fixed;bottom:22px;right:22px;z-index:200;width:52px;height:52px;border:none;border-radius:50%;background:linear-gradient(135deg,#4a9eff,#6366f1);color:#fff;cursor:pointer;box-shadow:0 8px 28px rgba(74,158,255,.45);display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.chat-fab:hover{transform:scale(1.05);}
.chat-fab svg{width:22px;height:22px;}
.chat-panel{position:fixed;bottom:86px;right:22px;z-index:200;width:min(380px,calc(100vw - 32px));height:min(520px,calc(100vh - 120px));background:var(--bg2);border:1px solid var(--border);border-radius:18px;box-shadow:0 16px 48px rgba(0,0,0,.22);display:none;flex-direction:column;overflow:hidden;}
.chat-panel.open{display:flex;}
.chat-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg3);}
.chat-head-title{font-size:14px;font-weight:800;}
.chat-head-sub{font-size:11px;color:var(--text3);}
.chat-close{border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:18px;line-height:1;}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.chat-msg{max-width:92%;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-wrap;}
.chat-msg.user{align-self:flex-end;background:rgba(255,107,43,.14);border:1px solid rgba(255,107,43,.25);}
.chat-msg.bot{align-self:flex-start;background:var(--bg3);border:1px solid var(--border);}
.chat-foot{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px;}
.chat-input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-family:inherit;font-size:13px;resize:none;min-height:42px;max-height:100px;}
.chat-send{padding:10px 14px;border:none;border-radius:10px;background:linear-gradient(135deg,#4a9eff,#6366f1);color:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.chat-send:disabled{opacity:.5;cursor:wait;}
.chat-status{display:none;}
.uc-role.admin{color:var(--accent);}.uc-role.lead{color:#a78bfa;}.uc-role.employee{color:#34d399;}
.uc-avatar{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logout-btn{width:34px;height:34px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .2s;}
.logout-btn:hover{border-color:#f87171;color:#f87171;}
.logout-btn svg{width:15px;height:15px;}
.role-note{font-size:11px;color:var(--text3);background:var(--bg4);border-radius:6px;padding:3px 10px;}
/* ── Employee "My Time" view ── */
.emp-hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(255,107,43,0.10),rgba(74,158,255,0.06));border:1px solid var(--border);border-radius:var(--radius);padding:22px 26px;margin-bottom:24px;}
.emp-hero-hi{font-size:22px;font-weight:800;letter-spacing:-0.02em;}
.emp-hero-sub{font-size:13px;color:var(--text2);margin-top:2px;}
.emp-util{text-align:right;}
.emp-util-val{font-size:30px;font-weight:800;line-height:1;}
.emp-util-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
.filter-bar{display:inline-flex;align-items:center;background:var(--bg2);border:1px solid rgba(255,107,43,0.25);border-radius:14px;box-shadow:var(--card-shadow);overflow:visible;transition:border-color .2s,box-shadow .2s;flex-shrink:0;position:relative;}
.filter-bar:hover{border-color:rgba(255,107,43,0.6);box-shadow:var(--card-shadow),0 0 0 3px rgba(255,107,43,0.07);}
.fb-group:first-child{border-radius:14px 0 0 14px;}
.fb-group:last-of-type{border-radius:0 14px 14px 0;}
.fb-group{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding:12px 14px;position:relative;cursor:pointer;transition:background .15s;height:100%;}
.fb-group:hover{background:rgba(255,107,43,0.03);}
.fb-label{display:none;}
.fb-select{background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;font-weight:600;padding:0;outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;}
.fb-select:focus{color:var(--accent);}
.fb-select option{background:var(--bg2);color:var(--text);}
.fb-arrow{width:20px;height:20px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:var(--text3);transition:all .2s;flex-shrink:0;pointer-events:none;}
.fb-group:hover .fb-arrow,.fb-group.open .fb-arrow{background:rgba(255,107,43,0.12);border-color:rgba(255,107,43,0.3);color:var(--accent);}
.fb-val{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;user-select:none;}
.fb-group.open .fb-arrow{transform:rotate(180deg);}
.fb-divider{width:1px;background:var(--border);flex-shrink:0;align-self:stretch;margin:10px 0;}
.fb-reset{display:none;align-items:center;gap:6px;background:transparent;border:none;border-left:1px solid var(--border);color:var(--text3);font-family:inherit;font-size:11px;font-weight:700;padding:0 14px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;letter-spacing:.04em;text-transform:uppercase;height:100%;}
.fb-reset.visible{display:flex;}
.fb-reset:hover{color:var(--accent);background:rgba(255,107,43,0.05);}
.fb-reset-x{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:var(--bg4);border-radius:50%;font-size:9px;font-weight:700;transition:all .15s;}
.fb-reset:hover .fb-reset-x{background:var(--accent);color:#fff;}
.fb-dropdown{position:absolute;top:calc(100% + 8px);left:0;min-width:200px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.18);z-index:9998;overflow:hidden;display:none;flex-direction:column;}
.fb-dropdown.open{display:flex;}
.fb-search-wrap{padding:8px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;}
.fb-search-icon{font-size:11px;color:var(--text3);flex-shrink:0;}
.fb-search{background:transparent;border:none;outline:none;font-family:inherit;font-size:12px;font-weight:500;color:var(--text);width:100%;}
.fb-search::placeholder{color:var(--text3);}
.fb-opts{max-height:200px;overflow-y:auto;padding:4px 0;}
.fb-opt{display:block;width:100%;text-align:left;padding:8px 14px;font-family:inherit;font-size:12px;font-weight:500;color:var(--text2);background:transparent;border:none;cursor:pointer;transition:all .1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fb-opt:hover{background:rgba(255,107,43,0.07);color:var(--text);}
.fb-opt.active{color:var(--accent);font-weight:700;}
.fb-opt.active::before{content:'✓ ';font-size:10px;}
.fb-no-results{padding:10px 14px;font-size:12px;color:var(--text3);font-style:italic;}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);margin-bottom:14px;margin-top:8px;}
.metrics-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:28px;}
.metric-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--card-shadow);position:relative;overflow:hidden;transition:transform .2s;}
.metric-card:hover{transform:translateY(-2px);}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--card-accent,var(--accent));opacity:.8;}
.metrics-grid .metric-card:nth-child(1){--card-accent:#ff6b2b;}
.metrics-grid .metric-card:nth-child(2){--card-accent:#ffaa4d;}
.metrics-grid .metric-card:nth-child(3){--card-accent:#ff8c5a;}
.metrics-grid .metric-card:nth-child(4){--card-accent:#ffd166;}
.metrics-grid .metric-card:nth-child(5){--card-accent:#ff6b2b;}
.metrics-grid .metric-card:nth-child(6){--card-accent:#34d399;}

function isTaskSource(src){ return src==='clickup' || src==='google_task'; }
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function safeUrl(u){const s=String(u||'').trim();if(!s)return '';try{const x=new URL(s,location.origin);if(x.protocol==='http:'||x.protocol==='https:')return x.href;}catch(e){}return '';}
function taskLinkHtml(r){const label=esc(r.Task||'-');const u=safeUrl(r.Url);return u?'<a class="task-link" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+label+' &#8599;</a>':label;}
function getCsrfToken(){const m=document.cookie.match(/(?:^|;\s*)csrf_token=([^;]+)/);if(m)try{return decodeURIComponent(m[1]);}catch(e){return m[1];}return (ME&&ME.csrf)||'';}
async function apiFetch(url,opts={}){const options=Object.assign({credentials:'same-origin'},opts);const headers=new Headers(options.headers||{});const method=String(options.method||'GET').toUpperCase();if(method!=='GET'&&method!=='HEAD'&&method!=='OPTIONS'){const t=getCsrfToken();if(t)headers.set('X-CSRF-Token',t);}options.headers=headers;return fetch(url,options);}
async function doLogout(e){if(e)e.preventDefault();try{await apiFetch('/api/logout',{method:'POST'});}catch(_){ }location.href='/';}
function hardenRows(rows){return (rows||[]).map(r=>{const o=Object.assign({},r);if(o.Url)o.Url=safeUrl(o.Url);return o;});}

// Unique task ID for dedupe (top bar "Tasks Logged" stat)
function taskKey(r){
  const url=r.Url||r.URL||r.url||'';
  if(url&&url!=='-') return 'u:'+url;
  return 't:'+(r.Task||'')+'|'+(r.Client||'')+'|'+(r.Space||'');
}
// Count unique task IDs from a set of rows (only clickup source counts as tasks)
function uniqueTaskCount(rows){
  const s=new Set();
  rows.forEach(r=>{if(isTaskSource(r.Source)) s.add(taskKey(r));});
  return s.size;
}

// ── Excel Export ──
function exportExcel(){
  document.getElementById('exportWrap').classList.remove('open');
  const data=getFiltered();
  if(!data.length){alert('No data to export for the selected filters/period.');return;}

  // Digilatics brand palette
  const BRAND={
    orange:'FF6B2B',orangeLight:'FFF1E8',orangeDark:'CC4D14',
    blue:'4A9EFF',blueLight:'EAF4FF',
    text:'0A1628',textMuted:'4A5A78',textLight:'8899BB',
    rowBand:'F7F9FD',border:'E5E9F0',headerText:'FFFFFF',
    bgWhite:'FFFFFF',accent:'FFAA4D'
  };

  const thinBorder={style:'thin',color:{rgb:BRAND.border}};
  const allBorders={top:thinBorder,bottom:thinBorder,left:thinBorder,right:thinBorder};

  // ── Style builders ──
  const titleStyle={font:{name:'Calibri',sz:18,bold:true,color:{rgb:BRAND.orange}},alignment:{vertical:'center',horizontal:'left'}};
  const subtitleStyle={font:{name:'Calibri',sz:10,color:{rgb:BRAND.textMuted},italic:true},alignment:{vertical:'center',horizontal:'left'}};
  const headerStyle={font:{name:'Calibri',sz:11,bold:true,color:{rgb:BRAND.headerText}},fill:{patternType:'solid',fgColor:{rgb:BRAND.orange}},alignment:{vertical:'center',horizontal:'center',wrapText:true},border:allBorders};
  const sectionHeaderStyle={font:{name:'Calibri',sz:11,bold:true,color:{rgb:BRAND.text}},fill:{patternType:'solid',fgColor:{rgb:BRAND.orangeLight}},alignment:{vertical:'center',horizontal:'left'},border:allBorders};
  const rowStyle=(banded)=>({font:{name:'Calibri',sz:10,color:{rgb:BRAND.text}},fill:{patternType:'solid',fgColor:{rgb:banded?BRAND.rowBand:BRAND.bgWhite}},alignment:{vertical:'center',horizontal:'left',wrapText:false},border:allBorders});
  const rowNumStyle=(banded)=>({...rowStyle(banded),alignment:{vertical:'center',horizontal:'right'},numFmt:'#,##0.00'});
  const rowIntStyle=(banded)=>({...rowStyle(banded),alignment:{vertical:'center',horizontal:'right'},numFmt:'#,##0'});
  const rowDateStyle=(banded)=>({...rowStyle(banded),alignment:{vertical:'center',horizontal:'left'},numFmt:'yyyy-mm-dd'});
  const totalsStyle={font:{name:'Calibri',sz:11,bold:true,color:{rgb:BRAND.text}},fill:{patternType:'solid',fgColor:{rgb:BRAND.orangeLight}},alignment:{vertical:'center',horizontal:'right'},numFmt:'#,##0.00',border:{top:{style:'medium',color:{rgb:BRAND.orange}},bottom:thinBorder,left:thinBorder,right:thinBorder}};
  const totalsLabelStyle={...totalsStyle,alignment:{vertical:'center',horizontal:'right'},font:{name:'Calibri',sz:11,bold:true,color:{rgb:BRAND.text}}};

  // Helper: apply a style to a cell, creating it if missing
  const setCell=(ws,addr,value,style,type)=>{
    ws[addr]={v:value,t:type||(typeof value==='number'?'n':'s')};
    if(style)ws[addr].s=style;
  };
  const mergeCell=(ws,from,to)=>{ws['!merges']=ws['!merges']||[];ws['!merges'].push({s:XLSX.utils.decode_cell(from),e:XLSX.utils.decode_cell(to)});};

  // ── Compute aggregates ──
  const totalH=data.reduce((s,r)=>s+parseFloat(r.Hours||0),0);
  const taskH=data.filter(r=>isTaskSource(r.Source)).reduce((s,r)=>s+parseFloat(r.Hours||0),0);
  const meetH=data.filter(r=>r.Source==='meeting').reduce((s,r)=>s+parseFloat(r.Hours||0),0);
  const tasksCount=data.filter(r=>isTaskSource(r.Source)).length;
  const meetCount=data.filter(r=>r.Source==='meeting').length;
  const clientHours=groupSum(data,'Client');
  const userHours=groupSum(data,'User');
  const spaceHours=groupSum(data,'Space');
  const periodLabel=getPeriodLabel();
  const generatedAt=new Date().toLocaleString('en-US',{timeZone:TZ,dateStyle:'medium',timeStyle:'short'})+' ET';

  const wb=XLSX.utils.book_new();

  // ════════════════════════════════════════════════════════════════
  // SHEET 1: Summary
  // ════════════════════════════════════════════════════════════════
  const wsSum={};
  wsSum['!ref']='A1:D30';
  wsSum['!cols']=[{wch:32},{wch:18},{wch:18},{wch:18}];
  wsSum['!rows']=[{hpt:32},{hpt:18},{hpt:8},{hpt:22},{hpt:22},{hpt:22},{hpt:22},{hpt:22},{hpt:22},{hpt:22}];

  setCell(wsSum,'A1','⧗ Digilatics Time Intelligent Dashboard',titleStyle);
  mergeCell(wsSum,'A1','D1');
  setCell(wsSum,'A2','Period: '+periodLabel+'  ·  Generated: '+generatedAt,subtitleStyle);
  mergeCell(wsSum,'A2','D2');

  // Section: Overview
  setCell(wsSum,'A4','PERFORMANCE OVERVIEW',sectionHeaderStyle);
  mergeCell(wsSum,'A4','D4');
  const overview=[
    ['Total Hours',totalH,'All sources combined'],
    ['Task Hours',taskH,'From ClickUp'],
    ['Meeting Hours',meetH,'From Google Calendar'],
    ['Tasks Logged',tasksCount,'ClickUp entries'],
    ['Meetings Logged',meetCount,'Calendar events'],
    ['Avg Hours / Task',tasksCount>0?taskH/tasksCount:0,'Average per task'],
    ['Active Clients',Object.keys(clientHours).length,'Unique clients'],
    ['Active Members',Object.keys(userHours).length,'Unique members'],
  ];
  overview.forEach((row,i)=>{
    const r=5+i,banded=i%2===1;
    const labelStyle={...rowStyle(banded),font:{name:'Calibri',sz:10,bold:true,color:{rgb:BRAND.textMuted}}};
    setCell(wsSum,'A'+r,row[0],labelStyle);
    const isInt=Number.isInteger(row[1])&&row[1]<1000&&row[0].indexOf('Hours')===-1&&row[0].indexOf('Avg')===-1;
    setCell(wsSum,'B'+r,row[1],isInt?rowIntStyle(banded):rowNumStyle(banded));
    const subStyle={...rowStyle(banded),font:{name:'Calibri',sz:9,italic:true,color:{rgb:BRAND.textLight}}};
    setCell(wsSum,'C'+r,row[2],subStyle);
    mergeCell(wsSum,'C'+r,'D'+r);
  });

  // Footer note
  const footerR=5+overview.length+2;
  setCell(wsSum,'A'+footerR,'Generated by Digilatics Time Intelligent Dashboard',{font:{name:'Calibri',sz:9,italic:true,color:{rgb:BRAND.textLight}}});
  mergeCell(wsSum,'A'+footerR,'D'+footerR);

  wsSum['!ref']=XLSX.utils.encode_range({s:{c:0,r:0},e:{c:3,r:footerR}});
  XLSX.utils.book_append_sheet(wb,wsSum,'Summary');

  // ════════════════════════════════════════════════════════════════
  // Helper: build a clean data sheet
  // ════════════════════════════════════════════════════════════════
  const buildSheet=(title,subtitle,headers,rowsData,colWidths,colTypes,totalsRow)=>{
    const ws={};
    const nCols=headers.length;
    const lastColLetter=XLSX.utils.encode_col(nCols-1);

    // Row 1: title
    setCell(ws,'A1',title,titleStyle);
    mergeCell(ws,'A1',lastColLetter+'1');
    // Row 2: subtitle
    setCell(ws,'A2',subtitle,subtitleStyle);
    mergeCell(ws,'A2',lastColLetter+'2');

    // Row 4: headers
    headers.forEach((h,i)=>{
      const addr=XLSX.utils.encode_cell({c:i,r:3});
      setCell(ws,addr,h,headerStyle);
    });

    // Data rows starting at row 5 (index 4)
    rowsData.forEach((row,ri)=>{
      const banded=ri%2===1;
      row.forEach((val,ci)=>{
        const addr=XLSX.utils.encode_cell({c:ci,r:4+ri});
        const t=colTypes[ci];
        let style;
        if(t==='num')style=rowNumStyle(banded);
        else if(t==='int')style=rowIntStyle(banded);
        else if(t==='date')style=rowDateStyle(banded);
        else style=rowStyle(banded);
        setCell(ws,addr,val,style,typeof val==='number'?'n':'s');
      });
    });

    // Totals row
    let lastDataRow=4+rowsData.length-1;
    if(totalsRow){
      const tr=4+rowsData.length;
      totalsRow.forEach((val,ci)=>{
        const addr=XLSX.utils.encode_cell({c:ci,r:tr});
        if(val===null||val===undefined||val==='')setCell(ws,addr,'',totalsLabelStyle);
        else if(typeof val==='number')setCell(ws,addr,val,totalsStyle,'n');
        else setCell(ws,addr,val,totalsLabelStyle,'s');
      });
      lastDataRow=tr;
    }

    ws['!ref']=XLSX.utils.encode_range({s:{c:0,r:0},e:{c:nCols-1,r:lastDataRow}});
    ws['!cols']=colWidths.map(w=>({wch:w}));
    ws['!rows']=[{hpt:32},{hpt:16},{hpt:6},{hpt:26}];
    // Freeze header
    ws['!freeze']={xSplit:'0',ySplit:'4',topLeftCell:'A5',activePane:'bottomLeft',state:'frozen'};
    ws['!autofilter']={ref:XLSX.utils.encode_range({s:{c:0,r:3},e:{c:nCols-1,r:lastDataRow-(totalsRow?1:0)}})};
    return ws;
  };

  // ════════════════════════════════════════════════════════════════
  // SHEET 2: All Entries (detailed log)
  // ════════════════════════════════════════════════════════════════
  const entryHeaders=['Date','Client','Task / Meeting','Member','Hours','Minutes','Source','Space','Team','URL'];
  const entryRows=data.slice().sort((a,b)=>(b._date||'').localeCompare(a._date||'')).map(r=>{
    const dt=r._date?new Date(r._date+'T00:00:00'):'';
    return [
      dt,
      r.Client||'',
      r.Task||'',
      su(r.User)||r.User||'',
      parseFloat(r.Hours||0),
      Math.round(parseFloat(r.Hours||0)*60),
      isTaskSource(r.Source)?'Task':r.Source==='meeting'?'Meeting':r.Source||'',
      r.Space&&r.Space!=='-'?r.Space:'',
      r.Team||'',
      r.Url||r.URL||r.url||''
    ];
  });
  const entryTotals=['','','','TOTAL',totalH,Math.round(totalH*60),'','','',''];
  const wsEntries=buildSheet(
    'All Entries',
    'Period: '+periodLabel+'  ·  '+entryRows.length+' entries  ·  Generated: '+generatedAt,
    entryHeaders,entryRows,
    [13,28,55,28,10,10,12,20,20,55],
    ['date','text','text','text','num','int','text','text','text','text'],
    entryTotals
  );
  XLSX.utils.book_append_sheet(wb,wsEntries,'All Entries');

  // ════════════════════════════════════════════════════════════════
  // SHEET 3: By Client
  // ════════════════════════════════════════════════════════════════
  const clientRows=Object.entries(clientHours).sort((a,b)=>b[1]-a[1]).map(([c,h])=>{
    const cd=data.filter(r=>r.Client===c);
    const tH=cd.filter(r=>isTaskSource(r.Source)).reduce((s,r)=>s+parseFloat(r.Hours||0),0);
    const mH=cd.filter(r=>r.Source==='meeting').reduce((s,r)=>s+parseFloat(r.Hours||0),0);
    const members=new Set(cd.map(r=>r.User).filter(Boolean)).size;
    const tasks=cd.filter(r=>isTaskSource(r.Source)).length;
    const meetings=cd.filter(r=>r.Source==='meeting').length;
    // Team-wise hours breakdown (sorted by hours desc, rounded to 2 decimals)
    const teamMap={};
    cd.forEach(r=>{const t=r.Team||'(no team)';teamMap[t]=(teamMap[t]||0)+parseFloat(r.Hours||0);});
    const teamBreakdown=Object.entries(teamMap).sort((a,b)=>b[1]-a[1]).map(([t,th])=>t+': '+th.toFixed(2)+'h').join(', ');
    return [c,h,tH,mH,tasks,meetings,members,teamBreakdown];
  });
  const clientTotals=['TOTAL',totalH,taskH,meetH,tasksCount,meetCount,Object.keys(userHours).length,''];
  const wsClients=buildSheet(
    'By Client',
    'Hours grouped by client  ·  Period: '+periodLabel,
    ['Client','Total Hours','Task Hours','Meeting Hours','Tasks','Meetings','Members','Team Hours Breakdown'],
    clientRows,
    [32,14,14,14,10,10,10,60],
    ['text','num','num','num','int','int','int','text'],
    clientTotals
  );
  XLSX.utils.book_append_sheet(wb,wsClients,'By Client');

  // ════════════════════════════════════════════════════════════════
  // SHEET 4: By Member
  // ════════════════════════════════════════════════════════════════
  const memberRows=Object.entries(userHours).sort((a,b)=>b[1]-a[1]).map(([u,h])=>{
    const ud=data.filter(r=>r.User===u);
    const tH=ud.filter(r=>isTaskSource(r.Source)).reduce((s,r)=>s+parseFloat(r.Hours||0),0);
    const mH=ud.filter(r=>r.Source==='meeting').reduce((s,r)=>s+parseFloat(r.Hours||0),0);
    const clients=new Set(ud.map(r=>r.Client).filter(Boolean)).size;
    const days=new Set(ud.map(r=>r._date).filter(Boolean)).size;
    const memberTeam=[...new Set(ud.map(r=>r.Team).filter(Boolean))].join(', ')||'Unknown';
    return [su(u),u,memberTeam,h,tH,mH,clients,days];
  });
  const memberTotals=['TOTAL','','',totalH,taskH,meetH,Object.keys(clientHours).length,new Set(data.map(r=>r._date).filter(Boolean)).size];
  const wsMembers=buildSheet(
    'By Member',
    'Hours grouped by team member  ·  Period: '+periodLabel,
    ['Member','Email','Team','Total Hours','Task Hours','Meeting Hours','Clients','Active Days'],
    memberRows,
    [22,32,20,14,14,14,10,12],
    ['text','text','text','num','num','num','int','int'],
    memberTotals
  );
  XLSX.utils.book_append_sheet(wb,wsMembers,'By Member');

  // ════════════════════════════════════════════════════════════════
  // SHEET 5: By Team (Employee Directory teams)
  // ════════════════════════════════════════════════════════════════
  const teamHours=groupSum(data,'Team');
  const teamRows=Object.entries(teamHours).sort((a,b)=>b[1]-a[1]).map(([t,h])=>{
    const td=data.filter(r=>r.Team===t);
    const tH=td.filter(r=>isTaskSource(r.Source)).reduce((a,r)=>a+parseFloat(r.Hours||0),0);
    const mH=td.filter(r=>r.Source==='meeting').reduce((a,r)=>a+parseFloat(r.Hours||0),0);
    const clients=new Set(td.map(r=>r.Client).filter(Boolean)).size;
    const members=new Set(td.map(r=>r.User).filter(Boolean)).size;
    return [t||'(Unknown)',h,tH,mH,members,clients];
  });
  const teamTotals=['TOTAL',totalH,taskH,meetH,Object.keys(userHours).length,Object.keys(clientHours).length];
  const wsTeams=buildSheet(
    'By Team',
    'Hours grouped by department  ·  Period: '+periodLabel,
    ['Team','Total Hours','Task Hours','Meeting Hours','Members','Clients'],
    teamRows,
    [24,14,14,14,10,10],
    ['text','num','num','num','int','int'],
    teamTotals
  );
  XLSX.utils.book_append_sheet(wb,wsTeams,'By Team');

  // ════════════════════════════════════════════════════════════════
  // SHEET 6: By Space (ClickUp spaces)
  // ════════════════════════════════════════════════════════════════
  const spaceRows=Object.entries(spaceHours).sort((a,b)=>b[1]-a[1]).map(([s,h])=>{
    const sd=data.filter(r=>r.Space===s);
    const tH=sd.filter(r=>isTaskSource(r.Source)).reduce((a,r)=>a+parseFloat(r.Hours||0),0);
    const mH=sd.filter(r=>r.Source==='meeting').reduce((a,r)=>a+parseFloat(r.Hours||0),0);
    const clients=new Set(sd.map(r=>r.Client).filter(Boolean)).size;
    const members=new Set(sd.map(r=>r.User).filter(Boolean)).size;
    return [s||'(Unknown)',h,tH,mH,clients,members];
  });
  const spaceTotals=['TOTAL',totalH,taskH,meetH,Object.keys(clientHours).length,Object.keys(userHours).length];
  const wsSpaces=buildSheet(
    'By Space',
    'Hours grouped by ClickUp space  ·  Period: '+periodLabel,
    ['Space','Total Hours','Task Hours','Meeting Hours','Clients','Members'],
    spaceRows,
    [24,14,14,14,10,10],
    ['text','num','num','num','int','int'],
    spaceTotals
  );
  XLSX.utils.book_append_sheet(wb,wsSpaces,'By Space');

  // ── Set workbook properties & write ──
  wb.Props={Title:'Digilatics Time Intelligent Dashboard',Author:'Digilatics',Company:'Digilatics',Subject:'Time tracking export — '+periodLabel,CreatedDate:new Date()};

  const periodSlug=periodLabel.replace(/[^a-zA-Z0-9\s\-→]/g,'').replace(/\s+/g,'_').replace(/→/g,'to');
  const filename='Digilatics_Time_'+periodSlug+'_'+new Date().toISOString().slice(0,10)+'.xlsx';
  XLSX.writeFile(wb,filename,{cellStyles:true,bookType:'xlsx'});
}

const gTip=document.getElementById('g-tip');
let _tipEl=null;
function _showTip(el,html){gTip.innerHTML=html;gTip.style.display='block';_moveTip(el);_tipEl=el;}
function _hideTip(){gTip.style.display='none';_tipEl=null;}
function _moveTip(el){
  const r=el.getBoundingClientRect(),tw=gTip.offsetWidth,th=gTip.offsetHeight;
  let left=r.left,top=r.top-th-8;
  if(top<8)top=r.bottom+8;
  if(left+tw>window.innerWidth-8)left=window.innerWidth-tw-8;
  if(left<8)left=8;
  gTip.style.left=left+'px';gTip.style.top=top+'px';
}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(el)_showTip(el,el.getAttribute('data-tip'));});
document.addEventListener('mouseout',e=>{const el=e.target.closest('[data-tip]');if(el&&!el.contains(e.relatedTarget))_hideTip();});
document.addEventListener('mousemove',()=>{if(_tipEl)_moveTip(_tipEl);});

function toET(d){return d.toLocaleDateString('en-CA',{timeZone:TZ});}
function parseDate(val){
  if(!val)return null;const s=String(val).trim();if(!s)return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  if(s.includes('T')&&(s.includes('-05:')||s.includes('-04:')))return s.substring(0,10);
  const gm=s.match(/^Date\((\d+),(\d+),(\d+)/);
  if(gm)return gm[1]+'-'+String(+gm[2]+1).padStart(2,'0')+'-'+String(+gm[3]).padStart(2,'0');
  const d=new Date(s);return isNaN(d)?null:toET(d);
}
function fmtH(h){const v=parseFloat(h)||0;if(v>=10)return Math.round(v)+'h';return(Math.round(v*10)/10).toFixed(1)+'h';}
// Top metric cards: round whole hours for values >=1, keep one decimal for values <1

function su(u){return(u||'').split('@')[0]||'-';}
function utilPct(hours,days){const cap=days*8;return cap>0?(hours/cap*100).toFixed(0):0;}
function utilBar(hours,days){
  const cap=days*8,raw=cap>0?(hours/cap*100):0,pct=Math.min(raw,100);
  const cls=raw>100?'over':raw>85?'warn':'';
  return '<div class="util-bar"><div class="util-fill '+cls+'" style="width:'+pct+'%"></div></div>';

function getPeriodLabel(){
  if(activePeriod==='custom'&&(customFrom||customTo)){
    const f=customFrom||'start',t=customTo||customFrom||'today';
    return f===t?f:f+' → '+t;
  }
  return PRESET_MAP[activePeriod]||'Yesterday';
}
function getActivePeriodRange(){
  const now=new Date(),todayET=toET(now);const yd=new Date(now);yd.setDate(now.getDate()-1);const ydStr=toET(yd);
  const wk=new Date(now);wk.setDate(now.getDate()-7);const wkStr=toET(wk);
  const nowD=new Date(now.toLocaleString('en-US',{timeZone:TZ}));
  const moFirst=nowD.getFullYear()+'-'+String(nowD.getMonth()+1).padStart(2,'0')+'-01';
  const lmDate=new Date(nowD.getFullYear(),nowD.getMonth()-1,1);
  const lmFirst=lmDate.getFullYear()+'-'+String(lmDate.getMonth()+1).padStart(2,'0')+'-01';
  const lmLastD=new Date(nowD.getFullYear(),nowD.getMonth(),0);
  const lmLast=lmDate.getFullYear()+'-'+String(lmDate.getMonth()+1).padStart(2,'0')+'-'+String(lmLastD.getDate()).padStart(2,'0');
  if(activePeriod==='yesterday')return{from:ydStr,to:ydStr};
  if(activePeriod==='day')return{from:todayET,to:todayET};
  if(activePeriod==='week')return{from:wkStr,to:todayET};
  if(activePeriod==='month')return{from:moFirst,to:todayET};
  if(activePeriod==='lastmonth')return{from:lmFirst,to:lmLast};
  if(activePeriod==='custom')return{from:customFrom||'',to:customTo||customFrom||''};
  if(activePeriod==='all'){const src=currentNav==='mytime'?myData:allData;const dates=src.map(r=>r._date).filter(Boolean).sort();return{from:dates[0]||'',to:dates[dates.length-1]||''};}
  return{from:'',to:''};
}

function getMyFiltered(){
  const now=new Date(),todayET=toET(now);
  const yd=new Date(now);yd.setDate(now.getDate()-1);const ydStr=toET(yd);
  const wk=new Date(now);wk.setDate(now.getDate()-7);const wkStr=toET(wk);
  const mo=now.toLocaleDateString('en-US',{timeZone:TZ,month:'numeric'});
  const yr=now.toLocaleDateString('en-US',{timeZone:TZ,year:'numeric'});
  const nowD=new Date(now.toLocaleString('en-US',{timeZone:TZ}));
  const lmDate=new Date(nowD.getFullYear(),nowD.getMonth()-1,1);
  const lmYr=String(lmDate.getFullYear());
  const lmFirst=lmYr+'-'+String(lmDate.getMonth()+1).padStart(2,'0')+'-01';
  const lmLastD=new Date(nowD.getFullYear(),nowD.getMonth(),0);
  const lmLast=lmYr+'-'+String(lmDate.getMonth()+1).padStart(2,'0')+'-'+String(lmLastD.getDate()).padStart(2,'0');
  return myData.filter(r=>{
    const d=r._date;
    if(activePeriod==='yesterday')return d===ydStr;
    if(activePeriod==='day')return d===todayET;
    if(activePeriod==='week')return d&&d>=wkStr;
    if(activePeriod==='month'){if(!d)return false;const dp=new Date(d+'T12:00:00');return String(dp.getMonth()+1)===mo&&String(dp.getFullYear())===yr;}
    if(activePeriod==='lastmonth')return d&&d>=lmFirst&&d<=lmLast;
    if(activePeriod==='custom'){if(!d)return false;if(customFrom&&d<customFrom)return false;if(customTo&&d>customTo)return false;return true;}
    if(activePeriod==='all')return true;
    return true;
  });
}

let livePollTimer=null;
const LIVE_POLL_MS=30*60*1000;

function fmtLiveH(h){const n=parseFloat(h||0);if(!n)return '0h';const hrs=Math.floor(n);const mins=Math.round((n-hrs)*60);return mins?hrs+'h '+mins+'m':hrs+'h';}

async function loadLiveToday(force){
  try{
    const url='/api/live/today'+(force?'?force=1':'');
    const res=await apiFetch(url,{credentials:'same-origin'});
    if(!res.ok)return;
    liveToday=await res.json();
    if(currentNav==='mytime'){
      const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
      set('mtLiveTotal',fmtLiveH(liveToday.totalHours));
      set('mtLiveTasks',fmtLiveH(liveToday.taskHours));
      set('mtLiveMeets',fmtLiveH(liveToday.meetHours));
      set('mtLiveEntries',String(liveToday.entries||0));
      const note=document.getElementById('mtSyncNote');
      if(note){
        if(liveToday.refreshed){
          note.textContent='Just refreshed · live from ClickUp + Calendar';
        }else{
          const cu=liveToday.clickupSource==='live'?'ClickUp live':'ClickUp cached';
          const mt=liveToday.meetSource==='live'?'Calendar live':'Calendar DB';
          note.textContent=cu+' · '+mt+' · auto refresh 30m';
        }
      }
    }
  }catch(e){console.log('live today:',e);}
}

async function rerunTodayLive(){
  const btn=document.getElementById('mtRerunBtn');
  if(btn){btn.disabled=true;btn.textContent='Refreshing today…';}
  showResyncOverlay(true);

    await loadLiveToday(true);

    showResyncOverlay(false);
    if(btn){btn.disabled=false;btn.innerHTML='&#8635; Re-run Today';}
  }
}

function startLivePoll(){

}

async function loadActiveTimers(){

    const res=await apiFetch('/api/active-timers',{credentials:'same-origin'});

    activeTimerData=(await res.json())

  }catch(e){

  }

/* ── Load ── */
async function loadData(){
  document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div>Loading your data...</div>';
  try{
    const myRes=await apiFetch('/api/my-data',{credentials:'same-origin'});
    if(myRes.status===401){showLogin();return;}
    if(!myRes.ok)throw new Error('my-data '+myRes.status);
    myData=mapRows(hardenRows(await myRes.json()));

    if(ME&&ME.role!=='employee'){
      const res=await apiFetch('/api/data',{credentials:'same-origin'});
      if(!res.ok)throw new Error('data '+res.status);
      allData=mapRows(hardenRows(await res.json()));
    }else{
      allData=myData;
    }

    populateFilters();
    const todayET=toET(new Date());
    if(currentNav==='mytime'||ME.role==='employee'){
      activePeriod='week';
    }else{
      activePeriod=myData.some(r=>r._date===todayET)?'day':'yesterday';
    }
    await loadActiveTimers();
    await loadLiveToday();
    renderCurrentView();
    document.getElementById('footer').textContent='Last refreshed: '+new Date().toLocaleString('en-US',{timeZone:TZ})+' ET';
  }catch(e){document.getElementById('content').innerHTML='<div class="loading">Couldn\u2019t load your data. Try Refresh, or sign in again.</div>';console.error(e);}
}

function renderCurrentView(){
  syncNavForRole();
  if(currentNav==='settings'){renderSettingsView();return;}
  if(currentNav==='mytime'||ME.role==='employee')renderMyTimeView();
  else renderDashboard();
}

  if(ME.role==='admin'&&access&&accessBtn){
    accessBtn.textContent='Full access';
    accessBtn.className='sidebar-access-btn';
    access.style.display='';

        x:0.2+Math.random()*0.6,
        y:0.2+Math.random()*0.6,
        r:22+Math.random()*90,
        speed:0.2+Math.random()*0.55,
        phase:Math.random()*Math.PI*2,
      });
    }
  }

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1, 2);
    w=stage.clientWidth; h=stage.clientHeight;
    canvas.width=Math.floor(w*dpr);
    canvas.height=Math.floor(h*dpr);
    canvas.style.width=w+'px';
    canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    seed();
  }

  function onMove(e){
    const r=stage.getBoundingClientRect();
    mouse.tx=(e.clientX-r.left)/Math.max(r.width,1);
    mouse.ty=(e.clientY-r.top)/Math.max(r.height,1);
  }
  function onLeave(){ mouse.tx=0.5; mouse.ty=0.5; }

  function frame(now){
    raf=requestAnimationFrame(frame);
    const t=(now-t0)/1000;
    mouse.x+=(mouse.tx-mouse.x)*0.08;
    mouse.y+=(mouse.ty-mouse.y)*0.08;
    const mx=(mouse.x-0.5), my=(mouse.y-0.5);

    ctx.clearRect(0,0,w,h);

    const wash=ctx.createRadialGradient(mouse.x*w, mouse.y*h, 0, mouse.x*w, mouse.y*h, Math.max(w,h)*0.55);
    wash.addColorStop(0,'rgba(255,107,43,0.18)');
    wash.addColorStop(0.45,'rgba(255,170,77,0.07)');
    wash.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=wash; ctx.fillRect(0,0,w,h);

    sparks.forEach((s,i)=>{
      const cx=s.x*w + mx*28;
      const cy=s.y*h + my*20;
      const a=s.phase+(reduce?0:t*s.speed);
      ctx.beginPath();
      ctx.ellipse(cx, cy, s.r, s.r*0.42, a*0.35, a, a+Math.PI*1.2);
      ctx.strokeStyle=i%2? 'rgba(255,107,43,0.3)' : 'rgba(26,26,26,0.14)';
      ctx.lineWidth=1.6;
      ctx.lineCap='round';
      ctx.stroke();
    });

    grains.forEach(g=>{
      if(!reduce){
        g.y+=g.vy*0.01;
        g.x+=g.vx*0.01 + mx*0.002;
        if(g.y>1.05){ g.y=-0.05; g.x=Math.random(); }
      }
      const px=g.x*w + mx*10;
      const py=g.y*h + my*6;
      ctx.beginPath();
      ctx.arc(px, py, g.r, 0, Math.PI*2);
      ctx.fillStyle='rgba(255,107,43,'+g.a+')';
      ctx.fill();
    });

    ctx.strokeStyle='rgba(26,26,26,0.12)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(mouse.x*w-18, mouse.y*h); ctx.lineTo(mouse.x*w+18, mouse.y*h);
    ctx.moveTo(mouse.x*w, mouse.y*h-18); ctx.lineTo(mouse.x*w, mouse.y*h+18);
    ctx.stroke();
  }

  resize();
  stage.addEventListener('pointermove', onMove);
  stage.addEventListener('pointerleave', onLeave);
  window.addEventListener('resize', resize);
  raf=requestAnimationFrame(frame);

  window.__loginBgStop=()=>{
    cancelAnimationFrame(raf);
    stage.removeEventListener('pointermove', onMove);
    stage.removeEventListener('pointerleave', onLeave);
    window.removeEventListener('resize', resize);
  };
}

  const now=new Date(),todayET=toET(now);const yd=new Date(now);yd.setDate(now.getDate()-1);const ydStr=toET(yd);const wk=new Date(now);wk.setDate(now.getDate()-7);const wkStr=toET(wk);
  const mo=now.toLocaleDateString('en-US',{timeZone:TZ,month:'numeric'});const yr=now.toLocaleDateString('en-US',{timeZone:TZ,year:'numeric'});
  const nowD=new Date(now.toLocaleString('en-US',{timeZone:TZ}));const lmDate=new Date(nowD.getFullYear(),nowD.getMonth()-1,1);const lmYr=String(lmDate.getFullYear());
  const lmFirst=lmYr+'-'+String(lmDate.getMonth()+1).padStart(2,'0')+'-01';const lmLastD=new Date(nowD.getFullYear(),nowD.getMonth(),0);const lmLast=lmYr+'-'+String(lmDate.getMonth()+1).padStart(2,'0')+'-'+String(lmLastD.getDate()).padStart(2,'0');

async function loadSyncStatus(){
  const host=document.getElementById('sec-sync');
  if(!host)return;
  host.style.display='';
  host.innerHTML='<div class="section-label">Sync Status</div><div class="loading"><div class="spinner"></div>Loading sync runs...</div>';
  try{
    const res=await apiFetch('/api/sync/status',{credentials:'same-origin'});
    if(!res.ok)throw new Error('status '+res.status);
    const runs=await res.json();
    let rows=runs.map(r=>'<tr><td>'+(r.job||'')+'</td><td>'+(r.status||'')+'</td><td>'+(r.rows_inserted??'')+'</td><td>'+(r.started_at||'')+'</td><td>'+(r.finished_at||'')+'</td></tr>').join('');
    if(!rows)rows='<tr><td colspan="5" style="color:var(--text3)">No sync runs yet</td></tr>';
    host.innerHTML=
      '<div class="section-label">Sync Status</div>'+
      '<div class="detail-card"><div class="card-header"><div><div class="table-title">Recent Sync Runs</div><div class="table-sub">ClickUp + Meet ingest jobs</div></div>'+
      '<div class="card-controls"><button class="refresh-btn" style="padding:7px 12px;font-size:12px" onclick="triggerSync(\'clickup\')">Run ClickUp</button>'+
      '<button class="refresh-btn" style="padding:7px 12px;font-size:12px;margin-left:8px" onclick="triggerSync(\'meet\')">Run Meet</button></div></div>'+
      '<div class="table-wrap"><table><thead><tr><th>Job</th><th>Status</th><th>Rows</th><th>Started</th><th>Finished</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }catch(e){
    host.innerHTML='<div class="section-label">Sync Status</div><div class="loading">Could not load sync status.</div>';
  }
}
async function triggerSync(job){
  try{
    const res=await apiFetch('/api/sync/'+job,{method:'POST',credentials:'same-origin'});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)alert(data.detail||('Sync failed: '+res.status));
    else {alert(job+' sync ok — inserted '+(data.debug&&data.debug.rowsInserted!=null?data.debug.rowsInserted:'?')); loadSyncStatus(); loadData();}
  }catch(e){alert('Sync failed');}
}

function settingsMsg(id,text,ok){

}

async function saveProfileSettings(ev){
  ev.preventDefault();
  const btn=document.getElementById('profSaveBtn');
  if(btn)btn.disabled=true;
  settingsMsg('profMsg','Saving…');
  const name=document.getElementById('profName').value.trim();
  const cur=document.getElementById('profCurPw').value;
  const nw=document.getElementById('profNewPw').value;
  const conf=document.getElementById('profConfPw').value;
  if(nw&&nw!==conf){settingsMsg('profMsg','New passwords do not match',false);if(btn)btn.disabled=false;return;}
  if(nw&&!cur){settingsMsg('profMsg','Enter your current password',false);if(btn)btn.disabled=false;return;}
  const body={name};
  if(nw){body.current_password=cur;body.new_password=nw;}
  try{
    const res=await apiFetch('/api/settings/profile',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await res.json().catch(()=>({}));
    if(!res.ok){settingsMsg('profMsg',data.detail||'Could not save profile',false);return;}
    settingsMsg('profMsg','Profile updated',true);
    if(ME){ME.name=name;document.getElementById('ucName').textContent=name;}
    document.getElementById('profCurPw').value='';
    document.getElementById('profNewPw').value='';
    document.getElementById('profConfPw').value='';
  }catch(e){settingsMsg('profMsg','Network error',false);}
  finally{if(btn)btn.disabled=false;}
}

async function saveClientSettings(ev){
  ev.preventDefault();
  const btn=document.getElementById('clientSaveBtn');
  if(btn)btn.disabled=true;
  settingsMsg('clientMsg',editingClientName?'Updating…':'Adding client…');
  const body={
    name:document.getElementById('clientName').value.trim(),
    aliases:document.getElementById('clientAliases').value.trim(),
    domains:document.getElementById('clientDomains').value.trim()
  };
  try{
    const res=await apiFetch('/api/admin/clients',{
      method:editingClientName?'PATCH':'POST',
      credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(editingClientName?{original_name:editingClientName,...body}:body)
    });
    const data=await res.json().catch(()=>({}));

    settingsMsg('clientMsg',(editingClientName?'Updated: ':'Added: ')+body.name,true);

function clearClientEditForm(){
  editingClientName=null;
  const form=document.getElementById('clientFormWrap');
  if(form)form.classList.remove('settings-form-editing');
  document.getElementById('clientName').value='';
  document.getElementById('clientAliases').value='';
  document.getElementById('clientDomains').value='';
  const btn=document.getElementById('clientSaveBtn');
  if(btn)btn.textContent='Add client';
  const cancel=document.getElementById('clientCancelBtn');
  if(cancel)cancel.style.display='none';
}

function startEditClient(name){
  const c=allClientsCache.find(x=>x.name===name);
  if(!c)return;
  editingClientName=c.name;
  document.getElementById('clientName').value=c.name;
  document.getElementById('clientAliases').value=(c.aliases||[]).join(', ');
  document.getElementById('clientDomains').value=(c.domains||[]).join(', ');
  const form=document.getElementById('clientFormWrap');
  if(form){form.classList.add('settings-form-editing');form.scrollIntoView({behavior:'smooth',block:'nearest'});}
  const btn=document.getElementById('clientSaveBtn');
  if(btn)btn.textContent='Save changes';
  const cancel=document.getElementById('clientCancelBtn');
  if(cancel)cancel.style.display='inline-flex';
  settingsMsg('clientMsg','Editing — update fields above',true);
}

async function deleteClient(name){
  if(!confirm('Delete client "'+name+'"? This cannot be undone.'))return;
  settingsMsg('clientMsg','Deleting…');
  try{
    const res=await apiFetch('/api/admin/clients?name='+encodeURIComponent(name),{method:'DELETE',credentials:'same-origin'});
    const data=await res.json().catch(()=>({}));
    if(!res.ok){settingsMsg('clientMsg',data.detail||'Could not delete',false);return;}
    if(editingClientName===name)clearClientEditForm();
    settingsMsg('clientMsg','Deleted: '+name,true);
    loadSettingsClientsList();
  }catch(e){settingsMsg('clientMsg','Network error',false);}
}

function filterClientsList(){
  const q=(document.getElementById('clientSearch')?.value||'').trim().toLowerCase();
  const rows=q?allClientsCache.filter(c=>{
    const hay=[c.name,(c.aliases||[]).join(' '),(c.domains||[]).join(' ')].join(' ').toLowerCase();
    return hay.includes(q);
  }):allClientsCache;
  renderClientsTableRows(rows);
}

function renderClientsTableRows(rows){
  const tbody=document.getElementById('clientListBody');
  const countEl=document.getElementById('clientListCount');
  if(!tbody)return;
  if(countEl)countEl.textContent=rows.length+' of '+allClientsCache.length+' clients';
  if(!rows.length){
    tbody.innerHTML='<tr><td colspan="4" style="color:var(--text3);padding:16px">No clients match your search.</td></tr>';
    return;
  }
  tbody.innerHTML=rows.map(c=>'<tr>'+
    '<td class="cell-name">'+esc(c.name)+'</td>'+
    '<td class="cell-aliases">'+esc((c.aliases||[]).join(', '))+'</td>'+
    '<td class="cell-domains">'+esc((c.domains||[]).join(', ')||'—')+'</td>'+
    '<td><div class="settings-crud">'+
      '<button type="button" onclick="startEditClient('+JSON.stringify(c.name)+')">Edit</button>'+
      '<button type="button" class="del" onclick="deleteClient('+JSON.stringify(c.name)+')">Delete</button>'+
    '</div></td></tr>').join('');
}
