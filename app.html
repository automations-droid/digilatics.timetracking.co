<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digilatics — Time Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<!-- SheetJS for Excel export -->
<!-- xlsx-js-style: drop-in fork of SheetJS that respects cell styles on write -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{--bg:#080c14;--bg2:#0e1420;--bg3:#131b2a;--bg4:#1a2436;--border:rgba(255,255,255,0.06);--text:#f0f4ff;--text2:#8899bb;--text3:#4a5a78;--accent:#ff6b2b;--accent2:#ffaa4d;--card-shadow:0 1px 3px rgba(0,0,0,0.5),0 8px 32px rgba(0,0,0,0.4);--radius:14px;--meet:#4a9eff;}
[data-theme="light"]{--bg:#f0f4fa;--bg2:#ffffff;--bg3:#f7f9fd;--bg4:#e8eef8;--border:rgba(0,0,0,0.07);--text:#0a1628;--text2:#4a5a78;--text3:#8899bb;--card-shadow:0 1px 3px rgba(0,0,0,0.05),0 8px 24px rgba(0,0,0,0.08);}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
.app{max-width:1440px;margin:0 auto;padding:24px;}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 0 32px;gap:20px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:14px;}
.brand-mark{width:40px;height:40px;background:#2a2621;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 24px rgba(255,107,43,0.5);}
.brand-name{font-weight:800;font-size:20px;letter-spacing:-0.02em;color:#f57d20;}
.brand-sub{font-size:12px;color:var(--text3);margin-top:1px;}
.header-controls{display:flex;align-items:center;gap:10px;}
.tz-badge{font-size:11px;color:var(--text3);background:var(--bg4);border-radius:6px;padding:3px 8px;margin-left:8px;}
.theme-btn{width:38px;height:38px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s;color:var(--text2);}
.theme-btn:hover{border-color:var(--accent);color:var(--text);}
.refresh-btn{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;padding:9px 18px;color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 4px 15px rgba(255,107,43,0.35);}
.refresh-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,107,43,0.5);}

/* ── Export Button ── */
.export-wrap{position:relative;}
.export-btn{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;color:var(--text2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.export-btn:hover{border-color:rgba(255,107,43,0.5);color:var(--text);background:var(--bg3);}
.export-btn svg{width:15px;height:15px;flex-shrink:0;}
.export-chevron{font-size:9px;opacity:.6;transition:transform .2s;}
.export-wrap.open .export-chevron{transform:rotate(180deg);}
.export-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--bg2);border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,0.18);z-index:9999;overflow:hidden;min-width:210px;}
.export-wrap.open .export-dropdown{display:block;}
.export-opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;font-family:inherit;font-size:13px;font-weight:500;color:var(--text2);background:transparent;border:none;cursor:pointer;transition:all .15s;text-align:left;}
.export-opt:hover{background:rgba(255,107,43,0.06);color:var(--text);}
.export-opt-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.export-opt-icon.pdf{background:rgba(239,68,68,0.12);color:#ef4444;}
.export-opt-icon.xls{background:rgba(34,197,94,0.12);color:#22c55e;}
.export-opt-label{display:flex;flex-direction:column;gap:1px;}
.export-opt-title{font-weight:700;font-size:12px;color:var(--text);}
.export-opt-sub{font-size:10px;color:var(--text3);}
.export-divider{height:1px;background:var(--border);margin:0;}

.loading{text-align:center;padding:80px 20px;color:var(--text3);}
.spinner{width:32px;height:32px;border:2px solid var(--bg4);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
.controls-bar{display:flex;align-items:stretch;gap:12px;margin-bottom:28px;justify-content:space-between;width:100%;}
.date-picker-wrap{position:relative;background:var(--bg2);border:1px solid rgba(255,107,43,0.25);border-radius:14px;box-shadow:var(--card-shadow);transition:border-color .2s,box-shadow .2s;flex-shrink:0;}
.date-picker-wrap:hover{border-color:rgba(255,107,43,0.6);box-shadow:var(--card-shadow),0 0 0 3px rgba(21, 20, 20, 0.07);}
.date-picker-btn{display:flex;align-items:center;gap:12px;width:100%;height:100%;padding:12px 14px;cursor:pointer;font-family:inherit;background:transparent;border:none;border-radius:14px;transition:background .15s;}
.date-picker-btn:hover,.date-picker-btn.open{background:rgba(255,107,43,0.04);}
.dpb-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,rgba(255,107,43,0.14),rgba(255,170,77,0.08));display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;border:1px solid rgba(255,107,43,0.15);}
.dpb-text{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;min-width:0;}
.dpb-label{display:none;}
.dpb-value{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dpb-arrow{width:20px;height:20px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--text3);transition:all .2s;flex-shrink:0;}
.date-picker-btn.open .dpb-arrow{transform:rotate(180deg);background:rgba(255,107,43,0.12);border-color:rgba(255,107,43,0.3);color:var(--accent);}
/* ── Date Picker Panel — matches screenshot style ── */
.dp-panel{display:none;position:absolute;top:calc(100% + 10px);right:0;background:#fff;border:1px solid #e5e9f0;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,0.13);z-index:9999;overflow:hidden;width:580px;}
[data-theme="dark"] .dp-panel{background:#0e1420;border-color:rgba(255,255,255,0.08);box-shadow:0 8px 40px rgba(0,0,0,0.5);}
.dp-panel.open{display:flex;}
.dp-presets{width:170px;flex-shrink:0;padding:14px 0;border-right:1px solid #e8edf5;background:#f7f9fd;}
[data-theme="dark"] .dp-presets{background:#131b2a;border-right-color:rgba(255,255,255,0.06);}
.dp-preset{display:block;width:100%;text-align:left;padding:10px 22px;font-family:inherit;font-size:13px;font-weight:500;color:#4a5a78;background:transparent;border:none;cursor:pointer;transition:all .12s;position:relative;}
[data-theme="dark"] .dp-preset{color:#8899bb;}
.dp-preset:hover{background:#eef1f8;color:#0a1628;}
[data-theme="dark"] .dp-preset:hover{background:#1a2436;color:#f0f4ff;}
.dp-preset.active{color:var(--accent);font-weight:700;background:transparent;}
.dp-preset.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:0 3px 3px 0;}
.dp-cal-wrap{flex:1;padding:18px 20px 16px;background:#fff;}
[data-theme="dark"] .dp-cal-wrap{background:#0e1420;}
.dp-date-inputs{display:flex;align-items:flex-end;gap:10px;margin-bottom:16px;}
.dp-date-field{flex:1;}
.dp-date-field label{display:block;font-size:9px;font-weight:700;color:#8899bb;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px;}
.dp-date-field input{width:100%;background:#f7f9fd;border:1px solid #e0e6f0;border-radius:9px;color:#0a1628;font-family:inherit;font-size:12px;font-weight:600;padding:9px 12px;outline:none;cursor:pointer;transition:border-color .15s;}
[data-theme="dark"] .dp-date-field input{background:#131b2a;border-color:rgba(255,255,255,0.08);color:#f0f4ff;}
.dp-date-field input:focus{border-color:var(--accent);}
.dp-date-field input::-webkit-calendar-picker-indicator{opacity:.5;cursor:pointer;}
[data-theme="dark"] .dp-date-field input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.4;}
.dp-dash{color:#c0cce0;font-size:20px;padding-bottom:9px;flex-shrink:0;}
.dp-month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.dp-month-label{font-size:14px;font-weight:700;color:#0a1628;}
[data-theme="dark"] .dp-month-label{color:#f0f4ff;}
.dp-nav-btn{width:30px;height:30px;background:#f7f9fd;border:1px solid #e0e6f0;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:#8899bb;transition:all .12s;line-height:1;}
[data-theme="dark"] .dp-nav-btn{background:#131b2a;border-color:rgba(255,255,255,0.08);color:#8899bb;}
.dp-nav-btn:hover{border-color:var(--accent);color:var(--accent);background:#fff8f5;}
[data-theme="dark"] .dp-nav-btn:hover{background:#1a2436;}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0;}
.dp-dow{text-align:center;font-size:11px;font-weight:600;color:#b0bdd4;padding:2px 0 10px;letter-spacing:.03em;}
.dp-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:400;color:#4a5a78;border-radius:8px;cursor:pointer;transition:all .1s;position:relative;margin:1px;}
[data-theme="dark"] .dp-day{color:#8899bb;}
.dp-day:hover:not(.dp-day-empty){background:#f0f4fa;color:#0a1628;}
[data-theme="dark"] .dp-day:hover:not(.dp-day-empty){background:#1a2436;color:#f0f4ff;}
.dp-day-empty{cursor:default;pointer-events:none;}
.dp-day-today{color:var(--accent);font-weight:700;}
.dp-day-today::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent);}
.dp-day-sel-from,.dp-day-sel-to{background:var(--accent)!important;color:#fff!important;font-weight:700;border-radius:8px;}
.dp-day-in-range{background:rgba(255,107,43,0.10);color:#cc4400;border-radius:0;}
[data-theme="dark"] .dp-day-in-range{background:rgba(255,107,43,0.13);color:#ffaa4d;}
.dp-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid #eef1f8;}
[data-theme="dark"] .dp-footer{border-top-color:rgba(255,255,255,0.06);}
.dp-cancel-btn{background:transparent;border:1px solid #dde3ee;border-radius:9px;color:#8899bb;font-family:inherit;font-size:12px;font-weight:600;padding:8px 18px;cursor:pointer;transition:all .12s;}
.dp-cancel-btn:hover{border-color:#8899bb;color:#4a5a78;}
.dp-apply-btn{background:var(--accent);border:none;border-radius:9px;color:#fff;font-family:inherit;font-size:12px;font-weight:700;padding:8px 20px;cursor:pointer;box-shadow:0 2px 8px rgba(255,107,43,0.35);transition:all .15s;}
.dp-apply-btn:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 14px rgba(255,107,43,0.45);}
/* ── Auth: sign-in gate ── */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;box-shadow:var(--card-shadow);padding:40px 36px;max-width:400px;width:100%;text-align:center;}
.login-mark{width:56px;height:56px;background:#2a2621;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 0 28px rgba(255,107,43,0.45);}
.login-mark img{width:34px;height:34px;object-fit:contain;}
.login-title{font-size:20px;font-weight:800;letter-spacing:-0.02em;margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px;line-height:1.5;}
.login-btn{display:inline-flex;align-items:center;gap:12px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px 22px;font-family:inherit;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;transition:all .2s;text-decoration:none;}
.login-btn:hover{border-color:rgba(255,107,43,0.6);background:var(--bg4);transform:translateY(-1px);}
.login-btn svg{width:18px;height:18px;}
.login-err{margin-top:18px;font-size:12px;color:#f87171;min-height:16px;}
.login-foot{margin-top:26px;font-size:11px;color:var(--text3);}
/* ── Header user chip ── */
.user-chip{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:5px 6px 5px 12px;}
.user-chip .uc-meta{display:flex;flex-direction:column;line-height:1.15;text-align:right;}
.user-chip .uc-name{font-size:12.5px;font-weight:700;color:var(--text);}
.user-chip .uc-role{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.uc-role.admin{color:var(--accent);}.uc-role.lead{color:#a78bfa;}.uc-role.employee{color:#34d399;}
.uc-avatar{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logout-btn{width:34px;height:34px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .2s;}
.logout-btn:hover{border-color:#f87171;color:#f87171;}
.logout-btn svg{width:15px;height:15px;}
.role-note{font-size:11px;color:var(--text3);background:var(--bg4);border-radius:6px;padding:3px 10px;}
/* ── Employee "My Time" view ── */
.emp-hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(255,107,43,0.10),rgba(74,158,255,0.06));border:1px solid var(--border);border-radius:var(--radius);padding:22px 26px;margin-bottom:24px;}
.emp-hero-hi{font-size:22px;font-weight:800;letter-spacing:-0.02em;}
.emp-hero-sub{font-size:13px;color:var(--text2);margin-top:2px;}
.emp-util{text-align:right;}
.emp-util-val{font-size:30px;font-weight:800;line-height:1;}
.emp-util-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
.filter-bar{display:inline-flex;align-items:center;background:var(--bg2);border:1px solid rgba(255,107,43,0.25);border-radius:14px;box-shadow:var(--card-shadow);overflow:visible;transition:border-color .2s,box-shadow .2s;flex-shrink:0;position:relative;}
.filter-bar:hover{border-color:rgba(255,107,43,0.6);box-shadow:var(--card-shadow),0 0 0 3px rgba(255,107,43,0.07);}
.fb-group:first-child{border-radius:14px 0 0 14px;}
.fb-group:last-of-type{border-radius:0 14px 14px 0;}
.fb-group{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding:12px 14px;position:relative;cursor:pointer;transition:background .15s;height:100%;}
.fb-group:hover{background:rgba(255,107,43,0.03);}
.fb-label{display:none;}
.fb-select{background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;font-weight:600;padding:0;outline:none;cursor:pointer;appearance:none;-webkit-appearance:none;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;}
.fb-select:focus{color:var(--accent);}
.fb-select option{background:var(--bg2);color:var(--text);}
.fb-arrow{width:20px;height:20px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:var(--text3);transition:all .2s;flex-shrink:0;pointer-events:none;}
.fb-group:hover .fb-arrow,.fb-group.open .fb-arrow{background:rgba(255,107,43,0.12);border-color:rgba(255,107,43,0.3);color:var(--accent);}
.fb-val{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;user-select:none;}
.fb-group.open .fb-arrow{transform:rotate(180deg);}
.fb-divider{width:1px;background:var(--border);flex-shrink:0;align-self:stretch;margin:10px 0;}
.fb-reset{display:none;align-items:center;gap:6px;background:transparent;border:none;border-left:1px solid var(--border);color:var(--text3);font-family:inherit;font-size:11px;font-weight:700;padding:0 14px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s;letter-spacing:.04em;text-transform:uppercase;height:100%;}
.fb-reset.visible{display:flex;}
.fb-reset:hover{color:var(--accent);background:rgba(255,107,43,0.05);}
.fb-reset-x{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:var(--bg4);border-radius:50%;font-size:9px;font-weight:700;transition:all .15s;}
.fb-reset:hover .fb-reset-x{background:var(--accent);color:#fff;}
.fb-dropdown{position:absolute;top:calc(100% + 8px);left:0;min-width:200px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.18);z-index:9998;overflow:hidden;display:none;flex-direction:column;}
.fb-dropdown.open{display:flex;}
.fb-search-wrap{padding:8px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;}
.fb-search-icon{font-size:11px;color:var(--text3);flex-shrink:0;}
.fb-search{background:transparent;border:none;outline:none;font-family:inherit;font-size:12px;font-weight:500;color:var(--text);width:100%;}
.fb-search::placeholder{color:var(--text3);}
.fb-opts{max-height:200px;overflow-y:auto;padding:4px 0;}
.fb-opt{display:block;width:100%;text-align:left;padding:8px 14px;font-family:inherit;font-size:12px;font-weight:500;color:var(--text2);background:transparent;border:none;cursor:pointer;transition:all .1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fb-opt:hover{background:rgba(255,107,43,0.07);color:var(--text);}
.fb-opt.active{color:var(--accent);font-weight:700;}
.fb-opt.active::before{content:'✓ ';font-size:10px;}
.fb-no-results{padding:10px 14px;font-size:12px;color:var(--text3);font-style:italic;}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);margin-bottom:14px;margin-top:8px;}
.metrics-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:28px;}
.metric-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--card-shadow);position:relative;overflow:hidden;transition:transform .2s;}
.metric-card:hover{transform:translateY(-2px);}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--card-accent,var(--accent));opacity:.8;}
.metrics-grid .metric-card:nth-child(1){--card-accent:#ff6b2b;}
.metrics-grid .metric-card:nth-child(2){--card-accent:#ffaa4d;}
.metrics-grid .metric-card:nth-child(3){--card-accent:#ff8c5a;}
.metrics-grid .metric-card:nth-child(4){--card-accent:#ffd166;}
.metrics-grid .metric-card:nth-child(5){--card-accent:#ff6b2b;}
.metrics-grid .metric-card:nth-child(6){--card-accent:#34d399;}
.metric-glow{position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:var(--card-accent,var(--accent));opacity:.06;filter:blur(20px);}
.metric-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:10px;}
.metric-value{font-size:30px;font-weight:800;color:var(--text);line-height:1;margin-bottom:6px;}
.metric-sub{font-size:11px;color:var(--text3);}
.top5-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px;}
.top5-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--card-shadow);}
.top5-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:14px;}

.top5-rank.r2{background:rgba(255,107,43,0.10);color:var(--accent2);}

.top5-val{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;}
.dual-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px;}
.panel-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--card-shadow);display:flex;flex-direction:column;}

.panel-empty{color:var(--text3);font-size:13px;padding:20px 0;text-align:center;}
.split-bar-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--card-shadow);margin-bottom:28px;display:flex;align-items:center;gap:28px;}
.split-label{font-size:12px;font-weight:700;color:var(--text2);white-space:nowrap;text-transform:uppercase;letter-spacing:.08em;}
.split-wrap{flex:1;}
.split-track{height:8px;border-radius:20px;background:var(--bg4);overflow:hidden;display:flex;}
.split-task{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;transition:width .6s cubic-bezier(.4,0,.2,1);}
.split-meeting{background:linear-gradient(90deg,#4a9eff,#74b9ff);height:100%;transition:width .6s cubic-bezier(.4,0,.2,1);}

.split-legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);}

.charts-stack{display:flex;flex-direction:column;gap:16px;margin-bottom:28px;}

.chart-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px;}

.chart-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px;}

.card-search-clear:hover{color:var(--accent);}
.ctrl-sep{width:1px;height:18px;background:var(--border);margin:0 2px;}
.ctrl-btn{background:transparent;border:1px solid var(--border);border-radius:6px;padding:4px 11px;font-size:11px;font-weight:700;color:var(--text3);cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap;letter-spacing:.03em;}
.ctrl-btn:hover{color:var(--text2);border-color:var(--text3);}
.ctrl-btn.c-all{border-color:rgba(52,211,153,0.35);color:#34d399;}
.ctrl-btn.c-all.active{background:rgba(52,211,153,0.18);border-color:#34d399;color:#1a9460;}
.ctrl-btn.c-task{border-color:rgba(255,107,43,0.35);color:var(--accent);}
.ctrl-btn.c-task.active{background:rgba(255,107,43,0.22);border-color:var(--accent);color:#c44a10;}

.tables-grid-1{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:16px;}
.table-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--card-shadow);}
.table-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;}
.table-sub{font-size:12px;color:var(--text3);}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
thead th:hover{color:var(--text2);}
thead th.th-sorted{color:var(--accent2);}
.sort-icon{margin-left:3px;opacity:.5;font-size:9px;}

tbody tr{border-bottom:1px solid var(--border);transition:background .15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--bg4);}

.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}

.chip-meeting{background:rgba(74,158,255,0.12);color:#4a9eff;}

.cl-label{font-size:11px;color:#4a9eff;cursor:default;border-bottom:1px dashed currentColor;padding-bottom:1px;display:inline-block;}
.cl-label:hover{color:var(--accent);}
.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap;}
.pagination-info{font-size:12px;color:var(--text3);}
.pagination-btns{display:flex;align-items:center;gap:4px;}
.pg-btn{min-width:30px;height:30px;padding:0 6px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text3);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15px;font-family:inherit;}

.pg-btn:disabled{opacity:.3;cursor:not-allowed;}
.pg-size{background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text2);font-family:inherit;font-size:12px;padding:4px 8px;outline:none;cursor:pointer;}

/* ── Print / PDF styles ── */
@media print{
  body{background:#fff!important;color:#000!important;}
  .header-controls,.controls-bar,.fb-reset,.pagination,.export-wrap,.refresh-btn,.theme-btn{display:none!important;}

<body>
<div id="g-tip"></div>
<div class="app">
  <div class="header">
    <div class="brand">
      <div class="brand-mark"><img src="logo.png" style="width:26px;height:26px;object-fit:contain;display:block;"></div>

        <div class="brand-name">Digilatics</div>

      <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme">&#9790;</button>

      <!-- Export Button -->

        <button class="export-btn" onclick="toggleExportMenu(event)" title="Export">

            </span>
          </button>

          <button class="export-opt" onclick="exportExcel()">
            <span class="export-opt-icon xls">📊</span>
            <span class="export-opt-label">
              <span class="export-opt-title">Export as Excel</span>
              <span class="export-opt-sub">Full filtered data (.xlsx)</span>

        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14H3a1 1 0 01-1-1V3a1 1 0 011-1h3M11 11l3-3-3-3M14 8H6"/></svg>
      </a>
    </div>
  </div>
  <div id="content"><div class="loading"><div class="spinner"></div>Loading data...</div></div>

<script>
const SHEET_ID='1Aw7efJ_Z0VHiHH9iR2cm-HsP2OA_4hQCxeekSimSasY';
const SHEET_NAME='Sheet1';
const TZ='America/New_York';
let ME=null; // {email,name,role,teams} — set by boot()
const PALETTE=['#ff6b2b','#4a9eff','#ffaa4d','#a78bfa','#34d399','#f87171','#60a5fa','#fbbf24','#e879f9','#2dd4bf'];
let allData=[],charts={},activePeriod='yesterday';
let activeTimerData=[];
let customFrom='',customTo='';
const CS={
  space:{src:'all',sort:'desc',page:1,perPage:10,q:''},
  team:{src:'all',sort:'desc',page:1,perPage:10,q:''},
  employee:{src:'all',sort:'desc',page:1,perPage:10,q:''},
  entries:{src:'all',sort:'desc',col:'date',page:1,perPage:10,q:''},
  chartClient:{src:'all',sort:'desc',q:''},chartMember:{src:'all',sort:'desc',q:''},
  chartDigilatics:{src:'all',sort:'desc',q:''},
  top5Most:{src:'all',q:''},top5Least:{src:'all',q:''},top5Mbr:{src:'all',q:''},
};
// Internal client name treated separately in Client Leaderboard
const INTERNAL_CLIENT='Digilatics';

// ── Ignored teams (poori team ka data dashboard se hide) ──
// Note: Lead Insight TEAM visible rahega kyunki Talha Riaz us mein hai.
// Dawood, Farwah, MJ individually IGNORED_USERS se hide ho rahe hain.
const IGNORED_TEAMS=new Set();

// ── Ignored users (email se match, case-insensitive) ──
const IGNORED_USERS=new Set([
  'csm@digilatics.com',          // CSM shared inbox
  'gul@digilatics.com',          // MJ (Lead Insight)
  'lead.insight@digilatics.com', // Dawood (Lead Insight)
  'leadaudit@digilatics.com'     // Farwah (Lead Insight)
]);

// Unique task ID for dedupe (top bar "Tasks Logged" stat)
function taskKey(r){
  const url=r.Url||r.URL||r.url||'';
  if(url&&url!=='-') return 'u:'+url;
  return 't:'+(r.Task||'')+'|'+(r.Client||'')+'|'+(r.Space||'');
}
// Count unique task IDs from a set of rows (only clickup source counts as tasks)
function uniqueTaskCount(rows){
  const s=new Set();
  rows.forEach(r=>{if(r.Source==='clickup') s.add(taskKey(r));});
  return s.size;
}

// ── Export Menu ──
function toggleExportMenu(e){
  e.stopPropagation();
  const wrap=document.getElementById('exportWrap');
  wrap.classList.toggle('open');
}
document.addEventListener('click',()=>{document.getElementById('exportWrap')?.classList.remove('open');});

// ── PDF Export ──
function exportPDF(){
  document.getElementById('exportWrap').classList.remove('open');
  // Give charts time to render, then print
  setTimeout(()=>window.print(),150);
}

// ── Excel Export ──
function exportExcel(){
  document.getElementById('exportWrap').classList.remove('open');
  const data=getFiltered();
  if(!data.length){alert('No data to export for the selected filters/period.');return;}

  // Digilatics brand palette
  const BRAND={
    orange:'FF6B2B',orangeLight:'FFF1E8',orangeDark:'CC4D14',
    blue:'4A9EFF',blueLight:'EAF4FF',
    text:'0A1628',textMuted:'4A5A78',textLight:'8899BB',
    rowBand:'F7F9FD',border:'E5E9F0',headerText:'FFFFFF',
    bgWhite:'FFFFFF',accent:'FFAA4D'
  };

  const thinBorder={style:'thin',color:{rgb:BRAND.border}};
  const allBorders={top:thinBorder,bottom:thinBorder,left:thinBorder,right:thinBorder};

  // ── Style builders ──
  const titleStyle={font:{name:'Calibri',sz:18,bold:true,color:{rgb:BRAND.orange}},alignment:{vertical:'center',horizontal:'left'}};
  const subtitleStyle={font:{name:'Calibri',sz:10,color:{rgb:BRAND.textMuted},italic:true},alignment:{vertical:'center',horizontal:'left'}};
  const headerStyle={font:{name:'Calibri',sz:11,bold:true,color:{rgb:BRAND.headerText}},fill:{patternType:'solid',fgColor:{rgb:BRAND.orange}},alignment:{vertical:'center',horizontal:'center',wrapText:true},border:allBorders};
  const sectionHeaderStyle={font:{name:'Calibri',sz:11,bold:true,color:{rgb:BRAND.text}},fill:{patternType:'solid',fgColor:{rgb:BRAND.orangeLight}},alignment:{vertical:'center',horizontal:'left'},border:allBorders};
  const rowStyle=(banded)=>({font:{name:'Calibri',sz:10,color:{rgb:BRAND.text}},fill:{patternType:'solid',fgColor:{rgb:banded?BRAND.rowBand:BRAND.bgWhite}},alignment:{vertical:'center',horizontal:'left',wrapText:false},border:allBorders});
  const rowNumStyle=(banded)=>({...rowStyle(banded),alignment:{vertical:'center',horizontal:'right'},numFmt:'#,##0.00'});
  const rowIntStyle=(banded)=>({...rowStyle(banded),alignment:{vertical:'center',horizontal:'right'},numFmt:'#,##0'});
  const rowDateStyle=(banded)=>({...rowStyle(banded),alignment:{vertical:'center',horizontal:'left'},numFmt:'yyyy-mm-dd'});
  const totalsStyle={font:{name:'Calibri',sz:11,bold:true,color:{rgb:BRAND.text}},fill:{patternType:'solid',fgColor:{rgb:BRAND.orangeLight}},alignment:{vertical:'center',horizontal:'right'},numFmt:'#,##0.00',border:{top:{style:'medium',color:{rgb:BRAND.orange}},bottom:thinBorder,left:thinBorder,right:thinBorder}};
  const totalsLabelStyle={...totalsStyle,alignment:{vertical:'center',horizontal:'right'},font:{name:'Calibri',sz:11,bold:true,color:{rgb:BRAND.text}}};

  // Helper: apply a style to a cell, creating it if missing
  const setCell=(ws,addr,value,style,type)=>{
    ws[addr]={v:value,t:type||(typeof value==='number'?'n':'s')};
    if(style)ws[addr].s=style;
  };
  const mergeCell=(ws,from,to)=>{ws['!merges']=ws['!merges']||[];ws['!merges'].push({s:XLSX.utils.decode_cell(from),e:XLSX.utils.decode_cell(to)});};

  // ── Compute aggregates ──
  const totalH=data.reduce((s,r)=>s+parseFloat(r.Hours||0),0);
  const taskH=data.filter(r=>r.Source==='clickup').reduce((s,r)=>s+parseFloat(r.Hours||0),0);
  const meetH=data.filter(r=>r.Source==='meeting').reduce((s,r)=>s+parseFloat(r.Hours||0),0);
  const tasksCount=data.filter(r=>r.Source==='clickup').length;
  const meetCount=data.filter(r=>r.Source==='meeting').length;
  const clientHours=groupSum(data,'Client');
  const userHours=groupSum(data,'User');
  const spaceHours=groupSum(data,'Space');
  const periodLabel=getPeriodLabel();
  const generatedAt=new Date().toLocaleString('en-US',{timeZone:TZ,dateStyle:'medium',timeStyle:'short'})+' ET';

  const wb=XLSX.utils.book_new();

  // ════════════════════════════════════════════════════════════════
  // SHEET 1: Summary
  // ════════════════════════════════════════════════════════════════
  const wsSum={};
  wsSum['!ref']='A1:D30';
  wsSum['!cols']=[{wch:32},{wch:18},{wch:18},{wch:18}];
  wsSum['!rows']=[{hpt:32},{hpt:18},{hpt:8},{hpt:22},{hpt:22},{hpt:22},{hpt:22},{hpt:22},{hpt:22},{hpt:22}];

  setCell(wsSum,'A1','⧗ Digilatics Time Intelligence',titleStyle);
  mergeCell(wsSum,'A1','D1');
  setCell(wsSum,'A2','Period: '+periodLabel+'  ·  Generated: '+generatedAt,subtitleStyle);
  mergeCell(wsSum,'A2','D2');

  // Section: Overview
  setCell(wsSum,'A4','PERFORMANCE OVERVIEW',sectionHeaderStyle);
  mergeCell(wsSum,'A4','D4');
  const overview=[
    ['Total Hours',totalH,'All sources combined'],
    ['Task Hours',taskH,'From ClickUp'],
    ['Meeting Hours',meetH,'From Google Calendar'],
    ['Tasks Logged',tasksCount,'ClickUp entries'],
    ['Meetings Logged',meetCount,'Calendar events'],
    ['Avg Hours / Task',tasksCount>0?taskH/tasksCount:0,'Average per task'],
    ['Active Clients',Object.keys(clientHours).length,'Unique clients'],
    ['Active Members',Object.keys(userHours).length,'Unique members'],
  ];
  overview.forEach((row,i)=>{
    const r=5+i,banded=i%2===1;
    const labelStyle={...rowStyle(banded),font:{name:'Calibri',sz:10,bold:true,color:{rgb:BRAND.textMuted}}};
    setCell(wsSum,'A'+r,row[0],labelStyle);
    const isInt=Number.isInteger(row[1])&&row[1]<1000&&row[0].indexOf('Hours')===-1&&row[0].indexOf('Avg')===-1;
    setCell(wsSum,'B'+r,row[1],isInt?rowIntStyle(banded):rowNumStyle(banded));
    const subStyle={...rowStyle(banded),font:{name:'Calibri',sz:9,italic:true,color:{rgb:BRAND.textLight}}};
    setCell(wsSum,'C'+r,row[2],subStyle);
    mergeCell(wsSum,'C'+r,'D'+r);
  });

  // Footer note
  const footerR=5+overview.length+2;
  setCell(wsSum,'A'+footerR,'Generated by Digilatics Time Intelligence Dashboard',{font:{name:'Calibri',sz:9,italic:true,color:{rgb:BRAND.textLight}}});
  mergeCell(wsSum,'A'+footerR,'D'+footerR);

  wsSum['!ref']=XLSX.utils.encode_range({s:{c:0,r:0},e:{c:3,r:footerR}});
  XLSX.utils.book_append_sheet(wb,wsSum,'Summary');

  // ════════════════════════════════════════════════════════════════
  // Helper: build a clean data sheet
  // ════════════════════════════════════════════════════════════════
  const buildSheet=(title,subtitle,headers,rowsData,colWidths,colTypes,totalsRow)=>{
    const ws={};
    const nCols=headers.length;
    const lastColLetter=XLSX.utils.encode_col(nCols-1);

    // Row 1: title
    setCell(ws,'A1',title,titleStyle);
    mergeCell(ws,'A1',lastColLetter+'1');
    // Row 2: subtitle
    setCell(ws,'A2',subtitle,subtitleStyle);
    mergeCell(ws,'A2',lastColLetter+'2');

    // Row 4: headers
    headers.forEach((h,i)=>{
      const addr=XLSX.utils.encode_cell({c:i,r:3});
      setCell(ws,addr,h,headerStyle);
    });

    // Data rows starting at row 5 (index 4)
    rowsData.forEach((row,ri)=>{
      const banded=ri%2===1;
      row.forEach((val,ci)=>{
        const addr=XLSX.utils.encode_cell({c:ci,r:4+ri});
        const t=colTypes[ci];
        let style;
        if(t==='num')style=rowNumStyle(banded);
        else if(t==='int')style=rowIntStyle(banded);
        else if(t==='date')style=rowDateStyle(banded);
        else style=rowStyle(banded);
        setCell(ws,addr,val,style,typeof val==='number'?'n':'s');
      });
    });

    // Totals row
    let lastDataRow=4+rowsData.length-1;
    if(totalsRow){
      const tr=4+rowsData.length;
      totalsRow.forEach((val,ci)=>{
        const addr=XLSX.utils.encode_cell({c:ci,r:tr});
        if(val===null||val===undefined||val==='')setCell(ws,addr,'',totalsLabelStyle);
        else if(typeof val==='number')setCell(ws,addr,val,totalsStyle,'n');
        else setCell(ws,addr,val,totalsLabelStyle,'s');
      });
      lastDataRow=tr;
    }

    ws['!ref']=XLSX.utils.encode_range({s:{c:0,r:0},e:{c:nCols-1,r:lastDataRow}});
    ws['!cols']=colWidths.map(w=>({wch:w}));
    ws['!rows']=[{hpt:32},{hpt:16},{hpt:6},{hpt:26}];
    // Freeze header
    ws['!freeze']={xSplit:'0',ySplit:'4',topLeftCell:'A5',activePane:'bottomLeft',state:'frozen'};
    ws['!autofilter']={ref:XLSX.utils.encode_range({s:{c:0,r:3},e:{c:nCols-1,r:lastDataRow-(totalsRow?1:0)}})};
    return ws;
  };

  // ════════════════════════════════════════════════════════════════
  // SHEET 2: All Entries (detailed log)
  // ════════════════════════════════════════════════════════════════
  const entryHeaders=['Date','Client','Task / Meeting','Member','Hours','Minutes','Source','Space','Team','URL'];
  const entryRows=data.slice().sort((a,b)=>(b._date||'').localeCompare(a._date||'')).map(r=>{
    const dt=r._date?new Date(r._date+'T00:00:00'):'';
    return [
      dt,
      r.Client||'',
      r.Task||'',
      su(r.User)||r.User||'',
      parseFloat(r.Hours||0),
      Math.round(parseFloat(r.Hours||0)*60),
      r.Source==='clickup'?'Task':r.Source==='meeting'?'Meeting':r.Source||'',
      r.Space&&r.Space!=='-'?r.Space:'',
      r.Team||'',
      r.Url||r.URL||r.url||''
    ];
  });
  const entryTotals=['','','','TOTAL',totalH,Math.round(totalH*60),'','','',''];
  const wsEntries=buildSheet(
    'All Entries',
    'Period: '+periodLabel+'  ·  '+entryRows.length+' entries  ·  Generated: '+generatedAt,
    entryHeaders,entryRows,
    [13,28,55,28,10,10,12,20,20,55],
    ['date','text','text','text','num','int','text','text','text','text'],
    entryTotals
  );
  XLSX.utils.book_append_sheet(wb,wsEntries,'All Entries');

  // ════════════════════════════════════════════════════════════════
  // SHEET 3: By Client
  // ════════════════════════════════════════════════════════════════
  const clientRows=Object.entries(clientHours).sort((a,b)=>b[1]-a[1]).map(([c,h])=>{
    const cd=data.filter(r=>r.Client===c);
    const tH=cd.filter(r=>r.Source==='clickup').reduce((s,r)=>s+parseFloat(r.Hours||0),0);
    const mH=cd.filter(r=>r.Source==='meeting').reduce((s,r)=>s+parseFloat(r.Hours||0),0);
    const members=new Set(cd.map(r=>r.User).filter(Boolean)).size;
    const tasks=cd.filter(r=>r.Source==='clickup').length;
    const meetings=cd.filter(r=>r.Source==='meeting').length;
    // Team-wise hours breakdown (sorted by hours desc, rounded to 2 decimals)
    const teamMap={};
    cd.forEach(r=>{const t=r.Team||'(no team)';teamMap[t]=(teamMap[t]||0)+parseFloat(r.Hours||0);});
    const teamBreakdown=Object.entries(teamMap).sort((a,b)=>b[1]-a[1]).map(([t,th])=>t+': '+th.toFixed(2)+'h').join(', ');
    return [c,h,tH,mH,tasks,meetings,members,teamBreakdown];
  });
  const clientTotals=['TOTAL',totalH,taskH,meetH,tasksCount,meetCount,Object.keys(userHours).length,''];
  const wsClients=buildSheet(
    'By Client',
    'Hours grouped by client  ·  Period: '+periodLabel,
    ['Client','Total Hours','Task Hours','Meeting Hours','Tasks','Meetings','Members','Team Hours Breakdown'],
    clientRows,
    [32,14,14,14,10,10,10,60],
    ['text','num','num','num','int','int','int','text'],
    clientTotals
  );
  XLSX.utils.book_append_sheet(wb,wsClients,'By Client');

  // ════════════════════════════════════════════════════════════════
  // SHEET 4: By Member
  // ════════════════════════════════════════════════════════════════
  const memberRows=Object.entries(userHours).sort((a,b)=>b[1]-a[1]).map(([u,h])=>{
    const ud=data.filter(r=>r.User===u);
    const tH=ud.filter(r=>r.Source==='clickup').reduce((s,r)=>s+parseFloat(r.Hours||0),0);
    const mH=ud.filter(r=>r.Source==='meeting').reduce((s,r)=>s+parseFloat(r.Hours||0),0);
    const clients=new Set(ud.map(r=>r.Client).filter(Boolean)).size;
    const days=new Set(ud.map(r=>r._date).filter(Boolean)).size;
    const memberTeam=[...new Set(ud.map(r=>r.Team).filter(Boolean))].join(', ')||'Unknown';
    return [su(u),u,memberTeam,h,tH,mH,clients,days];
  });
  const memberTotals=['TOTAL','','',totalH,taskH,meetH,Object.keys(clientHours).length,new Set(data.map(r=>r._date).filter(Boolean)).size];
  const wsMembers=buildSheet(
    'By Member',
    'Hours grouped by team member  ·  Period: '+periodLabel,
    ['Member','Email','Team','Total Hours','Task Hours','Meeting Hours','Clients','Active Days'],
    memberRows,
    [22,32,20,14,14,14,10,12],
    ['text','text','text','num','num','num','int','int'],
    memberTotals
  );
  XLSX.utils.book_append_sheet(wb,wsMembers,'By Member');

  // ════════════════════════════════════════════════════════════════
  // SHEET 5: By Team (Employee Directory teams)
  // ════════════════════════════════════════════════════════════════
  const teamHours=groupSum(data,'Team');
  const teamRows=Object.entries(teamHours).sort((a,b)=>b[1]-a[1]).map(([t,h])=>{
    const td=data.filter(r=>r.Team===t);
    const tH=td.filter(r=>r.Source==='clickup').reduce((a,r)=>a+parseFloat(r.Hours||0),0);
    const mH=td.filter(r=>r.Source==='meeting').reduce((a,r)=>a+parseFloat(r.Hours||0),0);
    const clients=new Set(td.map(r=>r.Client).filter(Boolean)).size;
    const members=new Set(td.map(r=>r.User).filter(Boolean)).size;
    return [t||'(Unknown)',h,tH,mH,members,clients];
  });
  const teamTotals=['TOTAL',totalH,taskH,meetH,Object.keys(userHours).length,Object.keys(clientHours).length];
  const wsTeams=buildSheet(
    'By Team',
    'Hours grouped by department  ·  Period: '+periodLabel,
    ['Team','Total Hours','Task Hours','Meeting Hours','Members','Clients'],
    teamRows,
    [24,14,14,14,10,10],
    ['text','num','num','num','int','int'],
    teamTotals
  );
  XLSX.utils.book_append_sheet(wb,wsTeams,'By Team');

  // ════════════════════════════════════════════════════════════════
  // SHEET 6: By Space (ClickUp spaces)
  // ════════════════════════════════════════════════════════════════
  const spaceRows=Object.entries(spaceHours).sort((a,b)=>b[1]-a[1]).map(([s,h])=>{
    const sd=data.filter(r=>r.Space===s);
    const tH=sd.filter(r=>r.Source==='clickup').reduce((a,r)=>a+parseFloat(r.Hours||0),0);
    const mH=sd.filter(r=>r.Source==='meeting').reduce((a,r)=>a+parseFloat(r.Hours||0),0);
    const clients=new Set(sd.map(r=>r.Client).filter(Boolean)).size;
    const members=new Set(sd.map(r=>r.User).filter(Boolean)).size;
    return [s||'(Unknown)',h,tH,mH,clients,members];
  });
  const spaceTotals=['TOTAL',totalH,taskH,meetH,Object.keys(clientHours).length,Object.keys(userHours).length];
  const wsSpaces=buildSheet(
    'By Space',
    'Hours grouped by ClickUp space  ·  Period: '+periodLabel,
    ['Space','Total Hours','Task Hours','Meeting Hours','Clients','Members'],
    spaceRows,
    [24,14,14,14,10,10],
    ['text','num','num','num','int','int'],
    spaceTotals
  );
  XLSX.utils.book_append_sheet(wb,wsSpaces,'By Space');

  // ── Set workbook properties & write ──
  wb.Props={Title:'Digilatics Time Intelligence',Author:'Digilatics',Company:'Digilatics',Subject:'Time tracking export — '+periodLabel,CreatedDate:new Date()};

  const periodSlug=periodLabel.replace(/[^a-zA-Z0-9\s\-→]/g,'').replace(/\s+/g,'_').replace(/→/g,'to');
  const filename='Digilatics_Time_'+periodSlug+'_'+new Date().toISOString().slice(0,10)+'.xlsx';
  XLSX.writeFile(wb,filename,{cellStyles:true,bookType:'xlsx'});
}

function toET(d){return d.toLocaleDateString('en-CA',{timeZone:TZ});}
function parseDate(val){
  if(!val)return null;const s=String(val).trim();if(!s)return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  if(s.includes('T')&&(s.includes('-05:')||s.includes('-04:')))return s.substring(0,10);
  const gm=s.match(/^Date\((\d+),(\d+),(\d+)/);
  if(gm)return gm[1]+'-'+String(+gm[2]+1).padStart(2,'0')+'-'+String(+gm[3]).padStart(2,'0');
  const d=new Date(s);return isNaN(d)?null:toET(d);
}
function fmtH(h){const v=parseFloat(h)||0;if(v>=10)return Math.round(v)+'h';return(Math.round(v*10)/10).toFixed(1)+'h';}

function fmtHMetric(h){const v=parseFloat(h)||0;if(v>=1)return Math.round(v)+'h';return(Math.round(v*10)/10).toFixed(1)+'h';}
function su(u){return(u||'').split('@')[0]||'-';}
function utilPct(hours,days){const cap=days*8;return cap>0?(hours/cap*100).toFixed(0):0;}
function utilBar(hours,days){
  const cap=days*8,raw=cap>0?(hours/cap*100):0,pct=Math.min(raw,100);
  const cls=raw>100?'over':raw>85?'warn':'';
  return '<div class="util-bar"><div class="util-fill '+cls+'" style="width:'+pct+'%"></div></div>';
}

function getPeriodLabel(){
  if(activePeriod==='custom'&&(customFrom||customTo)){
    const f=customFrom||'start',t=customTo||customFrom||'today';
    return f===t?f:f+' → '+t;
  }
  return PRESET_MAP[activePeriod]||'Yesterday';
}
function getActivePeriodRange(){
  const now=new Date(),todayET=toET(now);const yd=new Date(now);yd.setDate(now.getDate()-1);const ydStr=toET(yd);
  const wk=new Date(now);wk.setDate(now.getDate()-7);const wkStr=toET(wk);
  const nowD=new Date(now.toLocaleString('en-US',{timeZone:TZ}));
  const moFirst=nowD.getFullYear()+'-'+String(nowD.getMonth()+1).padStart(2,'0')+'-01';
  const lmDate=new Date(nowD.getFullYear(),nowD.getMonth()-1,1);
  const lmFirst=lmDate.getFullYear()+'-'+String(lmDate.getMonth()+1).padStart(2,'0')+'-01';
  const lmLastD=new Date(nowD.getFullYear(),nowD.getMonth(),0);
  const lmLast=lmDate.getFullYear()+'-'+String(lmDate.getMonth()+1).padStart(2,'0')+'-'+String(lmLastD.getDate()).padStart(2,'0');
  if(activePeriod==='yesterday')return{from:ydStr,to:ydStr};
  if(activePeriod==='day')return{from:todayET,to:todayET};
  if(activePeriod==='week')return{from:wkStr,to:todayET};
  if(activePeriod==='month')return{from:moFirst,to:todayET};
  if(activePeriod==='lastmonth')return{from:lmFirst,to:lmLast};

}

/* ── Load Active Timers ── */
async function loadActiveTimers(){
  try{
    const res=await fetch('/api/active-timers',{credentials:'same-origin'});
    if(!res.ok)throw new Error('timers '+res.status);
    activeTimerData=(await res.json())
      .filter(r=>r.User&&r.User!=='No active timers'&&r.User!=='-');
  }catch(e){
    console.log('Could not load active timers:',e);
    activeTimerData=[];
  }
}

/* ── Load ── */
async function loadData(){
  document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div>Loading your data...</div>';
  try{
    const res=await fetch('/api/data',{credentials:'same-origin'});
    if(res.status===401){showLogin();return;}
    if(!res.ok)throw new Error('data '+res.status);
    // Backend already returns ONLY the rows this user may see.
    allData=(await res.json()).map(r=>{
      r._date=parseDate(r.Date);return r;
    }).filter(r=>r.Client&&r.Client!==''&&r.Client!=='skipped')
      // Ignore filters (kept as a secondary display filter; access control is server-side)
      .filter(r=>{
        if(IGNORED_TEAMS.size && IGNORED_TEAMS.has(r.Team)) return false;
        if(IGNORED_USERS.has((r.User||'').toLowerCase())) return false;
        return true;
      });
    populateFilters();
    const todayET=toET(new Date());
    activePeriod=allData.some(r=>r._date===todayET)?'day':'yesterday';
    await loadActiveTimers();
    if(ME&&ME.role==='employee')renderEmployeeView();
    else renderDashboard();
    document.getElementById('footer').textContent='Last refreshed: '+new Date().toLocaleString('en-US',{timeZone:TZ})+' ET';
  }catch(e){document.getElementById('content').innerHTML='<div class="loading">Couldn\u2019t load your data. Try Refresh, or sign in again.</div>';console.error(e);}
}

/* ── Auth boot ── */
async function boot(){
  try{
    const res=await fetch('/api/me',{credentials:'same-origin'});
    if(res.status===401){showLogin();return;}
    ME=await res.json();
  }catch(e){showLogin();return;}
  // paint header chip
  const chip=document.getElementById('userChip');
  document.getElementById('ucName').textContent=ME.name||su(ME.email);
  const roleEl=document.getElementById('ucRole');
  roleEl.textContent=ME.role;roleEl.className='uc-role '+ME.role;
  document.getElementById('ucAvatar').textContent=(ME.name||ME.email||'?').trim().charAt(0).toUpperCase();
  chip.style.display='flex';
  document.getElementById('logoutBtn').style.display='flex';
  const note=document.getElementById('roleNote');
  if(ME.role==='lead'&&ME.teams&&ME.teams.length){note.textContent='Team: '+ME.teams.join(', ');note.style.display='';}
  else if(ME.role==='admin'){note.textContent='Full access';note.style.display='';}
  loadData();
}

function populateFilters(){const spaces=[...new Set(allData.map(r=>r.Space).filter(Boolean))].sort();const teams=[...new Set(allData.map(r=>r.Team).filter(Boolean))].sort();const clients=[...new Set(allData.map(r=>r.Client))].sort();const users=[...new Set(allData.map(r=>r.User).filter(Boolean))].sort();populateFbOpts('space',spaces);populateFbOpts('team',teams);populateFbOpts('client',clients);populateFbOpts('user',users);['space','team','client','user','source'].forEach(k=>{if(!fbOpts[k].find(o=>o.v===fbState[k]))fbState[k]='all';const el=document.getElementById('fbv-'+k);if(el)el.textContent=fbOpts[k].find(o=>o.v===fbState[k])?.l||fbDefaults[k];});}

function getFiltered(){
  const space=fbState.space||'all',team=fbState.team||'all',client=fbState.client||'all',user=fbState.user||'all',source=fbState.source||'all';
  const now=new Date(),todayET=toET(now);const yd=new Date(now);yd.setDate(now.getDate()-1);const ydStr=toET(yd);const wk=new Date(now);wk.setDate(now.getDate()-7);const wkStr=toET(wk);
  const mo=now.toLocaleDateString('en-US',{timeZone:TZ,month:'numeric'});const yr=now.toLocaleDateString('en-US',{timeZone:TZ,year:'numeric'});
  const nowD=new Date(now.toLocaleString('en-US',{timeZone:TZ}));const lmDate=new Date(nowD.getFullYear(),nowD.getMonth()-1,1);const lmYr=String(lmDate.getFullYear());
  const lmFirst=lmYr+'-'+String(lmDate.getMonth()+1).padStart(2,'0')+'-01';const lmLastD=new Date(nowD.getFullYear(),nowD.getMonth(),0);const lmLast=lmYr+'-'+String(lmDate.getMonth()+1).padStart(2,'0')+'-'+String(lmLastD.getDate()).padStart(2,'0');
  return allData.filter(r=>{if(space!=='all'&&r.Space!==space)return false;if(team!=='all'&&r.Team!==team)return false;if(client!=='all'&&r.Client!==client)return false;if(user!=='all'&&r.User!==user)return false;if(source!=='all'&&r.Source!==source)return false;const d=r._date;if(activePeriod==='yesterday'){if(!d||d!==ydStr)return false;}else if(activePeriod==='day'){if(!d||d!==todayET)return false;}else if(activePeriod==='week'){if(!d||d<wkStr)return false;}else if(activePeriod==='month'){if(!d)return false;const dp=new Date(d+'T12:00:00');if(String(dp.getMonth()+1)!==mo||String(dp.getFullYear())!==yr)return false;}else if(activePeriod==='lastmonth'){if(!d||d<lmFirst||d>lmLast)return false;}else if(activePeriod==='custom'){if(!d)return false;if(customFrom&&d<customFrom)return false;if(customTo&&d>customTo)return false;}return true;});
}

  const sw=Math.max(100/n,2).toFixed(3);
  const segs=activeTimerData.map((r,i)=>{

    const rad=n===1?'border-radius:20px;':i===0?'border-radius:20px 0 0 20px;':i===n-1?'border-radius:0 20px 20px 0;':'border-radius:0;';
    return '<div data-tip="'+tip+'" style="width:'+sw+'%;height:100%;background:'+col+';'+rad+'cursor:pointer;min-width:3px;" onmouseover="this.style.opacity=.7" onmouseout="this.style.opacity=1"></div>';
  }).join('');
  const items=activeTimerData.map(r=>{
    const col=uc[r.User||'Unknown'];
    const taskName=(r.Task||'Unnamed').length>30?(r.Task||'Unnamed').substring(0,28)+'...':r.Task||'Unnamed';
    const link=r.TaskUrl&&r.TaskUrl!=='-'?'<a class="task-link" href="'+r.TaskUrl+'" target="_blank" style="color:'+col+';font-weight:600;text-decoration:none;">'+taskName+' &#8599;</a>':'<span style="color:'+col+';font-weight:600;">'+taskName+'</span>';
    return '<div style="display:flex;align-items:center;gap:6px;padding:4px 0;min-width:0;">'+
      '<div style="width:7px;height:7px;border-radius:50%;background:'+col+';flex-shrink:0;animation:pulse 1.4s ease-in-out infinite;"></div>'+
      '<span style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;">'+link+'</span>'+
      '<span style="font-size:11px;color:var(--text3);white-space:nowrap;">'+r.User+'</span>'+
      '<span style="font-size:10px;color:#34d399;font-weight:700;flex-shrink:0;">&#9679; Live</span>'+
    '</div>';
  }).join('');
  return '<div class="split-bar-card" style="margin-bottom:0;flex-direction:column;align-items:flex-start;gap:12px;padding:16px 20px;">'+
    '<div style="display:flex;align-items:center;gap:10px;width:100%;"><span style="font-size:13px;font-weight:700;color:var(--text)">&#9201; Active Timers</span><span style="background:rgba(255,107,43,0.15);color:var(--accent);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;">'+n+' running</span></div>'+
    '<div style="width:100%;height:8px;border-radius:20px;overflow:hidden;display:flex;background:var(--bg4);gap:1px;">'+segs+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:2px 32px;width:100%;">'+items+'</div></div>';
}

function renderCharts(data){
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const gc=isDark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.06)',tc=isDark?'#5a5a72':'#9090aa',lc=isDark?'#9090a8':'#50506a';

  // ── Client Leaderboard: EXCLUDE Digilatics entirely (shown in its own card below) ──
  const cfAll=applySrc(data,CS.chartClient.src);
  const cf=cfAll.filter(r=>r.Client!==INTERNAL_CLIENT);
  const aCH=groupSum(cf,'Client');
  const qC=CS.chartClient.q||'';
  const sCk=Object.entries(aCH).filter(([n])=>strMatchesQ(n,qC)).sort((a,b)=>CS.chartClient.sort==='asc'?a[1]-b[1]:b[1]-a[1]).map(e=>e[0]);
  const sCkLabels=sCk.map(compactLabel);

  const tBC=sCk.map(c=>tD.filter(r=>r.Client===c).reduce((s,r)=>s+parseFloat(r.Hours||0),0));
  const mBC=sCk.map(c=>mD.filter(r=>r.Client===c).reduce((s,r)=>s+parseFloat(r.Hours||0),0));
  let cDS;
  if(CS.chartClient.src==='task')cDS=[{label:'Tasks',data:tBC,backgroundColor:'#ff6b2b',borderRadius:6,borderSkipped:false}];

  // ── Digilatics Internal: breakdown by Team (Space) — uses brand colors like Client Leaderboard ──
  const dCanvas=document.getElementById('dBar');
  if(dCanvas){
    const dAll=data.filter(r=>r.Client===INTERNAL_CLIENT);
    const df=applySrc(dAll,CS.chartDigilatics.src);
    const qD=CS.chartDigilatics.q||'';
    const dByTeam=groupSum(df,'Space');
    const dKeys=Object.entries(dByTeam).filter(([n])=>strMatchesQ(n,qD)).sort((a,b)=>CS.chartDigilatics.sort==='asc'?a[1]-b[1]:b[1]-a[1]).map(e=>e[0]);
    const dKeyLabels=dKeys.map(compactLabel);
    const dTaskH=dKeys.map(s=>df.filter(r=>r.Space===s&&r.Source==='clickup').reduce((a,r)=>a+parseFloat(r.Hours||0),0));
    const dMeetH=dKeys.map(s=>df.filter(r=>r.Space===s&&r.Source==='meeting').reduce((a,r)=>a+parseFloat(r.Hours||0),0));
    let dDS;
    if(CS.chartDigilatics.src==='task')dDS=[{label:'Tasks',data:dTaskH,backgroundColor:'#ff6b2b',borderRadius:6,borderSkipped:false}];
    else if(CS.chartDigilatics.src==='meeting')dDS=[{label:'Meetings',data:dMeetH,backgroundColor:'#4a9eff',borderRadius:6,borderSkipped:false}];
    else dDS=[{label:'Tasks',data:dTaskH,backgroundColor:'#ff6b2b',borderRadius:4,stack:'s'},{label:'Meetings',data:dMeetH,backgroundColor:'#4a9eff',borderRadius:4,stack:'s'}];

  const ukShort=uk.map(u=>su(u));
  const ukLabels=ukShort.map(compactLabel);
  if(charts.uBar)charts.uBar.destroy();
  charts.uBar=new Chart(document.getElementById('uBar'),{type:'bar',data:{labels:ukLabels,datasets:[{data:uk.map(u=>uh[u]),backgroundColor:PALETTE.slice(0,uk.length),borderRadius:8,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>ukShort[items[0].dataIndex]||items[0].label,label:c=>' '+fmtH(c.raw)}}},scales:{y:{grid:{color:gc},ticks:{color:tc,callback:v=>fmtH(v),font:{size:11}}},x:{grid:{display:false},ticks:{color:tc,font:{size:11}}}}}});
}

function renderEmpCharts(data){
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const gc=isDark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.06)',tc=isDark?'#5a5a72':'#9090aa';
  // Daily hours (stacked task/meeting by date, chronological)
  const dayKeys=[...new Set(data.map(r=>r._date).filter(Boolean))].sort();
  const dayLbl=dayKeys.map(d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}));
  const tByDay=dayKeys.map(d=>data.filter(r=>r._date===d&&r.Source==='clickup').reduce((a,r)=>a+parseFloat(r.Hours||0),0));
  const mByDay=dayKeys.map(d=>data.filter(r=>r._date===d&&r.Source==='meeting').reduce((a,r)=>a+parseFloat(r.Hours||0),0));
  const dc=document.getElementById('empDaily');
  if(dc)charts.empDaily=new Chart(dc,{type:'bar',data:{labels:dayLbl,datasets:[{label:'Tasks',data:tByDay,backgroundColor:'#ff6b2b',borderRadius:4,stack:'s'},{label:'Meetings',data:mByDay,backgroundColor:'#4a9eff',borderRadius:4,stack:'s'}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:true,position:'top',labels:{color:tc,font:{size:11},boxWidth:12,padding:14}},tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+fmtH(c.raw)}}},scales:{x:{stacked:true,grid:{display:false},ticks:{color:tc,font:{size:11}}},y:{stacked:true,grid:{color:gc},ticks:{color:tc,callback:v=>fmtH(v),font:{size:11}}}}}});
  // Hours by client
  const clientH=groupSum(data,'Client');
  const cKeys=Object.entries(clientH).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  const cc=document.getElementById('empClient');
  if(cc)charts.empClient=new Chart(cc,{type:'bar',data:{labels:cKeys.map(compactLabel),datasets:[{data:cKeys.map(c=>clientH[c]),backgroundColor:PALETTE.slice(0,cKeys.length||1),borderRadius:8,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>cKeys[items[0].dataIndex]||items[0].label,label:c=>' '+fmtH(c.raw)}}},scales:{y:{grid:{color:gc},ticks:{color:tc,callback:v=>fmtH(v),font:{size:11}}},x:{grid:{display:false},ticks:{color:tc,font:{size:11}}}}}});
}

function renderDashboard(){
  const data=getFiltered();
  const taskData=data.filter(r=>r.Source==='clickup'),meetData=data.filter(r=>r.Source==='meeting');
  const totalH=data.reduce((s,r)=>s+parseFloat(r.Hours||0),0);
  const taskH=taskData.reduce((s,r)=>s+parseFloat(r.Hours||0),0);
  const meetH=meetData.reduce((s,r)=>s+parseFloat(r.Hours||0),0);
  const tasksCount=uniqueTaskCount(taskData);
  const avgPerTask=tasksCount>0?taskH/tasksCount:0;
  const taskPct=totalH>0?(taskH/totalH*100).toFixed(0):0,meetPct=totalH>0?(meetH/totalH*100).toFixed(0):0;
  const ch=groupSum(data,'Client');
  Object.values(charts).forEach(c=>c.destroy());charts={};

  const ctrlTeam=mkSrcBtns('team')+'<div class="ctrl-sep"></div>'+mkSortBtns('team')+'<div class="ctrl-sep"></div>'+mkSearch('team','Search teams...');
  const ctrlSpace=mkSrcBtns('space')+'<div class="ctrl-sep"></div>'+mkSortBtns('space')+'<div class="ctrl-sep"></div>'+mkSearch('space','Search spaces...');
  const ctrlEmp=mkSrcBtns('employee')+'<div class="ctrl-sep"></div>'+mkSortBtns('employee')+'<div class="ctrl-sep"></div>'+mkSearch('employee','Search members...');
  const ctrlEnt=mkSrcBtns('entries')+'<div class="ctrl-sep"></div>'+mkSearch('entries','Search client, task, member...');
  const ctrlChClient=mkSrcBtns('chartClient')+'<div class="ctrl-sep"></div>'+mkSortBtns('chartClient')+'<div class="ctrl-sep"></div>'+mkSearch('chartClient','Search clients...');
  const ctrlChMember=mkSrcBtns('chartMember')+'<div class="ctrl-sep"></div>'+mkSortBtns('chartMember')+'<div class="ctrl-sep"></div>'+mkSearch('chartMember','Search members...');
  const ctrlChDigi=mkSrcBtns('chartDigilatics')+'<div class="ctrl-sep"></div>'+mkSortBtns('chartDigilatics')+'<div class="ctrl-sep"></div>'+mkSearch('chartDigilatics','Search teams...');

  // Compute Digilatics totals for the card subtitle
  const digiData=data.filter(r=>r.Client===INTERNAL_CLIENT);
  const digiTotal=digiData.reduce((s,r)=>s+parseFloat(r.Hours||0),0);
  const digiTaskH=digiData.filter(r=>r.Source==='clickup').reduce((s,r)=>s+parseFloat(r.Hours||0),0);
  const digiMeetH=digiData.filter(r=>r.Source==='meeting').reduce((s,r)=>s+parseFloat(r.Hours||0),0);

  document.getElementById('content').innerHTML=
    buildControlsBar()+
    '<div class="section-label">Performance Overview</div>'+
    '<div class="metrics-grid">'+
      mc('Total Hours',fmtHMetric(totalH),'All sources combined')+
      mc('Task Hours',fmtHMetric(taskH),'From ClickUp')+
      mc('Meeting Hours',fmtHMetric(meetH),'From Google Calendar')+
      mc('Tasks Logged',tasksCount,'ClickUp entries')+
      mc('Avg / Task',fmtHMetric(avgPerTask),'Avg hours per task')+
      mc('Clients',Object.keys(ch).length,'Active this period')+
    '</div>'+
    buildTop5Html(data)+
    buildTimersHtml()+
    '<div style="margin-bottom:28px;"></div>'+
    '<div class="split-bar-card"><div class="split-label">Tasks vs Meetings</div><div class="split-wrap"><div class="split-track"><div class="split-task" style="width:'+taskPct+'%"></div><div class="split-meeting" style="width:'+meetPct+'%"></div></div><div class="split-legend"><div class="split-legend-item"><div class="split-dot" style="background:var(--accent)"></div>Tasks &#8212; '+fmtH(taskH)+' ('+taskPct+'%)</div><div class="split-legend-item"><div class="split-dot" style="background:#4a9eff"></div>Meetings &#8212; '+fmtH(meetH)+' ('+meetPct+'%)</div></div></div></div>'+
    '<div class="section-label">Visual Analytics</div>'+
    '<div class="charts-stack">'+
      '<div class="chart-card"><div class="chart-card-header"><div><div class="chart-title">Client Leaderboard</div><div class="chart-sub">Tasks &amp; Meetings hours per client &middot; Digilatics shown separately below</div></div><div class="card-controls" id="ctrl-chartClient">'+ctrlChClient+'</div></div><div class="chart-wrap"><canvas id="cBar"></canvas></div></div>'+
      '<div class="chart-card"><div class="chart-card-header"><div><div class="chart-title" style="display:flex;align-items:center;gap:8px;">&#128737; Digilatics (Internal)</div><div class="chart-sub">Internal hours by Team &middot; Total: <strong style="color:var(--text)">'+fmtH(digiTotal)+'</strong> &middot; Tasks: <strong style="color:var(--accent)">'+fmtH(digiTaskH)+'</strong> &middot; Meetings: <strong style="color:#4a9eff">'+fmtH(digiMeetH)+'</strong></div></div><div class="card-controls" id="ctrl-chartDigilatics">'+ctrlChDigi+'</div></div><div class="chart-wrap"><canvas id="dBar"></canvas></div></div>'+
      '<div class="chart-card"><div class="chart-card-header"><div><div class="chart-title">Member Board</div><div class="chart-sub">Individual hours logged</div></div><div class="card-controls" id="ctrl-chartMember">'+ctrlChMember+'</div></div><div class="chart-wrap"><canvas id="uBar"></canvas></div></div>'+
    '</div>'+
    '<div class="section-label">Team Breakdown</div>'+
    '<div class="tables-grid-1"><div class="table-card"><div class="card-header"><div><div class="table-title">Team Breakdown</div><div class="table-sub">Hours logged by Department</div></div><div class="card-controls" id="ctrl-team">'+ctrlTeam+'</div></div><div class="table-wrap"><table><thead><tr><th>Team</th><th>Total</th><th>Tasks</th><th>Meetings</th><th>Members</th><th>Clients</th></tr></thead><tbody id="tbody-team"></tbody></table></div><div id="pg-team"></div></div></div>'+
    '<div class="section-label">Space Breakdown</div>'+
    '<div class="tables-grid-1"><div class="table-card"><div class="card-header"><div><div class="table-title">Space Breakdown</div><div class="table-sub">Hours logged by ClickUp Space</div></div><div class="card-controls" id="ctrl-space">'+ctrlSpace+'</div></div><div class="table-wrap"><table><thead><tr><th>Space</th><th>Total</th><th>Tasks</th><th>Meetings</th><th>Clients</th></tr></thead><tbody id="tbody-space"></tbody></table></div><div id="pg-space"></div></div></div>'+
    '<div class="section-label">Employee Details</div>'+
    '<div class="detail-card" style="margin-bottom:24px"><div class="card-header"><div><div class="table-title">Employee Breakdown</div><div class="table-sub">Hours logged vs Productivity</div></div><div class="card-controls" id="ctrl-employee">'+ctrlEmp+'</div></div><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Total</th><th>Tasks</th><th>Meetings</th><th>Utilization</th><th>Clients</th></tr></thead><tbody id="tbody-employee"></tbody></table></div><div id="pg-employee"></div></div>'+
    '<div class="section-label">All Entries</div>'+
    '<div class="detail-card"><div class="card-header"><div><div class="table-title">Full Activity Log</div><div class="table-sub">Click column headers to sort</div></div><div class="card-controls" id="ctrl-entries">'+ctrlEnt+'</div></div><div class="table-wrap"><table><thead><tr>'+thSort('date','Date')+thSort('client','Client')+'<th>Task / Meeting</th>'+thSort('member','Member')+thSort('hours','Hours')+'<th>Source</th><th>Space</th><th>Team</th></tr></thead><tbody id="tbody-entries"></tbody></table></div><div id="pg-entries"></div></div>';

  updateCard('team');
  updateCard('space');
  updateCard('employee');
  updateCard('entries');
  requestAnimationFrame(()=>{renderCharts(data);populateFilters();renderCal();syncResetBtn();});
}

function mc(label,value,sub){return '<div class="metric-card"><div class="metric-glow"></div><div class="metric-label">'+label+'</div><div class="metric-value">'+value+'</div><div class="metric-sub">'+sub+'</div></div>';}

boot();
</script>
</body>
</html>
